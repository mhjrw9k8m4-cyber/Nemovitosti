  <!-- Tahle stránka SI NENAČÍTÁ css/styles.css: má se zobrazit i tehdy,
       když web nejede nebo se styl nestáhne. Proto tu nesmí být var(--…)
       z paletky — proměnná by byla nedefinovaná, deklarace by se zahodila
       a karta by se roztáhla přes celou šířku. Jednou se to stalo. -->
  <style>
    :root{color-scheme:light;}
    /* ATRIBUT hidden MUSÍ PLATIT I TADY. Prohlížeč ho uplatňuje jen tím, že
       prvku ve svém vlastním stylu nastaví display:none, a pravidlo `a` níž
       nese display:inline-block — to ho přebije. Odkaz na okres, který se
       ukazuje jen tehdy, když se okres z adresy pozná, se proto kreslil
       vždycky: prázdná zelená pilulka 284×26 px bez textu, na kterou se
       navíc dalo dostat tabulátorem. Tahle stránka schválně nenačítá
       css/styles.css (404 má vyjít i tehdy, když ostatní soubory chybí),
       takže tu pojistka musí stát zvlášť. Hlídá scripts/test-skryte.mjs. */
    [hidden]{display:none !important;}
    /* Stylopis má `*{box-sizing:border-box}` a všechny míry výš jsou
       opsané z něj — bez téhož přepočtu by znamenaly něco jiného:
       tlačítko s min-height 44 px vyšlo na 62, protože se k němu
       ještě přičetlo odsazení a obrys. */
    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;margin:0;}
    /* TÁŽ PLOCHA A TÁŽ KARTA JAKO ZBYTEK WEBU — OPSANÉ, PROTOŽE TOKEN SI
       TAHLE STRÁNKA VZÍT NEMŮŽE.
       Do 27. 10. tu zbyla stará soustava: mátová plocha #E3EFE7, karta
       se zaoblením 20 px a těžkým stínem. Vedle dnešního webu (plocha
       #F4F0EA, bílá karta, zaoblení 10 px, lehký stín) to vypadalo jako
       jiný web — a je to stránka, na kterou člověk přijde právě ve
       chvíli, kdy neví, kde je.
       Hodnoty jsou tytéž jako tokeny --plocha-stranky, --plocha-karta,
       --line, --r-plocha a --e1; když se změní tam, musí se změnit i tady
       (hlídá scripts/test-soustava.mjs). */
    body{display:flex;align-items:center;justify-content:center;background:#F4F0EA;color:#101513;
      font-family:'Inter','Helvetica Neue',Arial,sans-serif;text-align:center;padding:24px;}
    .card{max-width:440px;width:100%;background:#FFFFFF;border:1px solid rgba(16,21,19,0.14);
      border-radius:14px;padding:24px 20px;
      box-shadow:0 1px 2px rgba(24,45,34,0.06), 0 6px 16px -10px rgba(24,45,34,0.22);}
    .mark{width:48px;height:48px;margin:0 auto 16px;display:block;}
    /* TÝŽ HLAS JAKO ZBYTEK WEBU. Web mluví jedním písmem (--font-nadpis
       i --font-ui jsou dnes Inter; věta o serifových nadpisech tu zůstala
       z podoby, která platila jeden týden v říjnu). Tahle stránka si
       nemůže vzít token — stylopis schválně nenačítá — takže tu stojí
       tatáž rodina vypsaná. Když se písmo změní, musí se změnit na obou
       místech; hlídá to scripts/test-pismo.mjs. */
    h1{font-family:'Inter','Helvetica Neue',Arial,sans-serif;
      font-size:28px;margin:0 0 8px;font-weight:600;letter-spacing:-0.03em;line-height:1.2;}
    p{color:#615C56;line-height:1.6;margin:0 0 20px;font-size:16px;}
    /* PLNÁ BARVA, NE PŘELIV. Ozdobné přelivy na ploše web nemá (viz
       PRELIVY v scripts/test-soustava.mjs); tenhle přežil proto, že
       hlídač četl jen oba stylopisy a do vložených stylů stránek
       nedosáhl. #175A40 je táž barva, jakou má --plocha-znacka (31. 10.
       zesvětlená z #004F2F — hlídá scripts/test-soustava.mjs). */
    /* Tlačítko je .btn-primary ze stylopisu, jen opsané: plocha
       --plocha-znacka, zaoblení --r-md, obrys z --znacka-hluboka a stín
       --glow. Výška 44 px je dotyková mez, kterou drží celý web. */
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
      background:#175A40;color:#fff;text-decoration:none;font-weight:700;
      padding:8px 20px;border-radius:14px;font-size:14px;
      border:1px solid rgba(18,70,50,0.55);
      box-shadow:0 6px 16px -8px rgba(18,70,50,0.55);}
    .akce{display:flex;flex-direction:column;gap:8px;}
    /* Záložní akce: týž tvar, jen bez plochy — jako .btn-sek na webu. */
    a.sec{background:none;color:#175A40;border:1px solid rgba(16,21,19,0.28);box-shadow:none;}
  </style>

<body>
  <!-- ORIENTAČNÍ BOD STRÁNKY. Odečítač nabízí skok „na hlavní obsah"
       podle <main>; bez něj se na téhle stránce nedá nikam skočit
       a čte se od začátku, značku po značce. Je to jediný obsah
       stránky, takže <main> patří přesně sem. -->
  <main class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="9" fill="#26694A"/>
      <path d="M16 8c-3.3 0-6 2.7-6 6 0 4.2 6 10 6 10s6-5.8 6-10c0-3.3-2.7-6-6-6z" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M13.4 15.2v-2.1l2.6-2 2.6 2v2.1" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 id="nadpis">Tuhle stránku jsme nenašli</h1>
    <p id="popis">Nejspíš je v adrese překlep, nebo jsme stránku přejmenovali.</p>
    <div class="akce">
      <a id="okres-link" href="/" hidden></a>
      <a id="home-link" href="/">Otevřít mapu pozemků</a>
    </div>
  </main>
  <script>
    /* Dřív tahle stránka po dvou a půl vteřinách sama skočila na mapu.
       Kdo sem přišel, nestihl si přečíst, co se stalo, a ocitl se jinde,
       než mířil — bez vysvětlení a bez toho, aby si to mohl rozmyslet.
       Teď se neděje nic sama od sebe; člověk si vybere.

       A hlavně: většina lidí se sem nedostane překlepem. Nabídky mizí —
       pozemek se prodá, inzerát vyprší — a jeho stránka se smaže. Kdo si
       odkaz uložil nebo ho od někoho dostal, skončí tady. „Tuhle stránku
       jsme nenašli" mu neřekne nic; „už není v nabídce" a odkaz na jeho
       okres ano.

       Seznam okresů sem dopisuje robot (scripts/generate-region-pages.mjs),
       ať se neopisuje ručně a nerozejde se se skutečnými stránkami. */
    (function () {
      // Základ webu je jiný na github.io (/Nemovitosti/) a na parcelaka.cz (/).
      var base = location.hostname.indexOf('github.io') !== -1 ? '/Nemovitosti/' : '/';
      var domu = document.getElementById('home-link');
      domu.setAttribute('href', base);

      var OKRESY = /*ZACATEK-OKRESY*/{"benesov":"Benešov","beroun":"Beroun","blansko":"Blansko","brno-mesto":"Brno-město","brno-venkov":"Brno-venkov","bruntal":"Bruntál","breclav":"Břeclav","cheb":"Cheb","chomutov":"Chomutov","chrudim":"Chrudim","domazlice":"Domažlice","decin":"Děčín","frydek-mistek":"Frýdek-Místek","havlickuv-brod":"Havlíčkův Brod","hodonin":"Hodonín","hradec-kralove":"Hradec Králové","jablonec-nad-nisou":"Jablonec nad Nisou","jesenik":"Jeseník","jihlava":"Jihlava","jindrichuv-hradec":"Jindřichův Hradec","jicin":"Jičín","karlovy-vary":"Karlovy Vary","karvina":"Karviná","kladno":"Kladno","klatovy":"Klatovy","kolin":"Kolín","kromeriz":"Kroměříž","kutna-hora":"Kutná Hora","liberec":"Liberec","litomerice":"Litoměřice","louny":"Louny","mlada-boleslav":"Mladá Boleslav","melnik":"Mělník","novy-jicin":"Nový Jičín","nymburk":"Nymburk","nachod":"Náchod","olomouc":"Olomouc","opava":"Opava","ostrava-mesto":"Ostrava-město","pardubice":"Pardubice","pelhrimov":"Pelhřimov","plzen-jih":"Plzeň-jih","plzen-mesto":"Plzeň-město","plzen-sever":"Plzeň-sever","prachatice":"Prachatice","praha":"Praha","praha-vychod":"Praha-východ","praha-zapad":"Praha-západ","prostejov":"Prostějov","pisek":"Písek","prerov":"Přerov","pribram":"Příbram","rakovnik":"Rakovník","rokycany":"Rokycany","rychnov-nad-kneznou":"Rychnov nad Kněžnou","semily":"Semily","sokolov":"Sokolov","strakonice":"Strakonice","svitavy":"Svitavy","tachov":"Tachov","teplice":"Teplice","trutnov":"Trutnov","tabor":"Tábor","trebic":"Třebíč","uherske-hradiste":"Uherské Hradiště","vsetin":"Vsetín","vyskov":"Vyškov","zlin":"Zlín","znojmo":"Znojmo","usti-nad-labem":"Ústí nad Labem","usti-nad-orlici":"Ústí nad Orlicí","ceska-lipa":"Česká Lípa","ceske-budejovice":"České Budějovice","cesky-krumlov":"Český Krumlov","sumperk":"Šumperk","zdar-nad-sazavou":"Žďár nad Sázavou"}/*KONEC-OKRESY*/;
      var soubor = decodeURIComponent(location.pathname.split('/').pop() || '');
      var m = /^pozemek-(.+)-[0-9a-z]{5,8}\.html$/.exec(soubor);
      if (!m) return;

      /* Název souboru je pozemek-OKRES-OBEC-otisk.html a obě části můžou
         mít pomlčky (praha-vychod, ceske-budejovice). Který kus je okres,
         se nepozná z tvaru — jen porovnáním se skutečným seznamem. Bere se
         nejdelší shoda, aby „praha-vychod" nevyhrálo nad „praha". */
      var zbytek = m[1], znacka = '', jmeno = '';
      for (var s in OKRESY) {
        if ((zbytek === s || zbytek.indexOf(s + '-') === 0) && s.length > znacka.length) {
          znacka = s; jmeno = OKRESY[s];
        }
      }

      document.getElementById('nadpis').textContent = 'Tenhle pozemek už v nabídce není';
      document.getElementById('popis').textContent = jmeno
        ? 'Buď se prodal, nebo jeho inzerát skončil. Co je teď na prodej v okrese ' + jmeno + ', najdete tady.'
        : 'Buď se prodal, nebo jeho inzerát skončil. Podívejte se, co je v nabídce teď.';

      if (znacka) {
        var o = document.getElementById('okres-link');
        o.setAttribute('href', base + 'pozemky-okres-' + znacka + '.html');
        o.textContent = 'Pozemky v okrese ' + jmeno;
        o.hidden = false;
        domu.className = 'sec';   // hlavní je teď okres, mapa je záložní
      }
    })();
  </script>
