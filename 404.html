<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka nenalezena — Parcelka</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EDEFF4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <style>
    :root{color-scheme:light;}
    html,body{height:100%;margin:0;}
    body{display:flex;align-items:center;justify-content:center;background:#EBEDF0;color:#141829;
      font-family:'Plus Jakarta Sans','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;}
    .card{max-width:440px;width:100%;background:#fff;border:1px solid rgba(20,26,40,0.13);
      border-radius:20px;padding:34px 28px;box-shadow:0 18px 40px -24px rgba(20,26,40,.3);}
    .mark{width:54px;height:54px;margin:0 auto 20px;display:block;}
    h1{font-size:22px;margin:0 0 10px;font-weight:700;letter-spacing:-0.01em;}
    p{color:#565F72;line-height:1.6;margin:0 0 22px;font-size:15px;}
    a{display:inline-block;background:linear-gradient(135deg,#5B93FF 0%,#4A55E0 55%,#6A34D8 100%);color:#fff;
      text-decoration:none;font-weight:700;padding:13px 24px;border-radius:12px;font-size:15px;
      box-shadow:0 8px 20px -10px rgba(74,80,220,.55);}
  </style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="9" fill="#3D63EE"/>
      <path d="M16 8c-3.3 0-6 2.7-6 6 0 4.2 6 10 6 10s6-5.8 6-10c0-3.3-2.7-6-6-6z" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M13.4 15.2v-2.1l2.6-2 2.6 2v2.1" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Tuhle stránku jsme nenašli</h1>
    <p>Za chvíli vás přesměrujeme na mapu příležitostí. Pokud se tak nestane, klepněte níž.</p>
    <a id="home-link" href="/">Otevřít mapu</a>
  </div>
  <script>
    // Základ webu je jiný na github.io (/Nemovitosti/) a na parcelaka.cz (/).
    (function(){
      var base = location.hostname.indexOf('github.io') !== -1 ? '/Nemovitosti/' : '/';
      var a = document.getElementById('home-link'); if (a) a.setAttribute('href', base);
      setTimeout(function(){ location.replace(base); }, 2500);
    })();
  </script>
<!-- Vercel Web Analytics (navstevnost) -->
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
