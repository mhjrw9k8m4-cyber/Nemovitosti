<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka nenalezena — Parcelka</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta http-equiv="refresh" content="3; url=/Nemovitosti/">
  <style>
    :root{color-scheme:dark;}
    html,body{height:100%;margin:0;}
    body{display:flex;align-items:center;justify-content:center;background:#16232F;color:#EAE6DD;
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;}
    .card{max-width:420px;}
    .mark{width:56px;height:56px;margin:0 auto 22px;display:block;}
    h1{font-size:22px;margin:0 0 10px;font-weight:600;}
    p{color:#9DB0BE;line-height:1.6;margin:0 0 22px;font-size:15px;}
    a{display:inline-block;background:linear-gradient(135deg,#C9982F,#E0B65C);color:#16232F;
      text-decoration:none;font-weight:700;padding:13px 22px;border-radius:10px;font-size:15px;}
  </style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="15" fill="#16232F"/>
      <path d="M16 16 L16 2 A14 14 0 0 1 30 16 Z" fill="#3E8E5B"/>
      <path d="M16 16 L30 16 A14 14 0 0 1 16 30 Z" fill="#C15B44"/>
      <path d="M16 16 L16 30 A14 14 0 0 1 2 16 Z" fill="#4C7A9E"/>
      <path d="M16 16 L2 16 A14 14 0 0 1 16 2 Z" fill="#A79C86"/>
      <circle cx="16" cy="16" r="4.5" fill="#16232F"/>
    </svg>
    <h1>Tuhle stránku jsme nenašli</h1>
    <p>Za chvíli vás přesměrujeme na mapu příležitostí. Pokud se tak nestane, klikněte níž.</p>
    <a href="/Nemovitosti/">Otevřít mapu</a>
  </div>
</body>
</html>
