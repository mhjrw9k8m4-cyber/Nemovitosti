name: Kontrola inzerátů

# Jedna kontrola při odeslání nestačí: odkaz na cizí nabídku po čase zmizí
# nebo se přesměruje jinam a fotka se může z úložiště ztratit. Tahle úloha
# projde zveřejněné inzeráty znovu — každou adresu zkusí TŘIKRÁT za sebou,
# aby jeden výpadek sítě nic neodsoudil — a výsledky zapíše do tabulky
# listing_checks. Sama nic nemaže ani neskrývá.

on:
  schedule:
    - cron: '20 4 * * *'      # jednou denně nad ránem (UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Kolik inzerátů projít'
        required: false
        default: '200'

# NEJMENŠÍ POTŘEBNÁ PRÁVA. Bez tohohle bloku dostane úloha práva, která
# má repozitář nastavená ve svém nastavení — tedy něco, co v repozitáři
# vidět není a co se dá přepnout mimo historii. Tahle úloha nic
# nezapisuje (nekomituje, nepíše komentáře, nenahrává artefakty), takže
# jí stačí přečíst si zdroj. Hlídá to scripts/test-ci-prava.mjs.
permissions:
  contents: read
  issues: write          # zakládá úkol, když úloha selže (viz poslední krok)

jobs:
  kontrola:
    runs-on: ubuntu-latest
    # Strop proti visícímu spojení, ne proti pomalosti: bez něj
    # GitHub úlohu zastaví až po šesti hodinách a další
    # naplánovaný běh se do té doby nespustí (obchází tisíce odkazů, každý s vlastním limitem).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # TOKEN NEZŮSTÁVÁ NA DISKU. actions/checkout si ho jinak zapíše
          # do .git/config a leží tam po celou úlohu — a tady se pak
          # instalují balíčky z npm a pouští se stovky skriptů. Žádný
          # krok téhle úlohy s gitem nemluví (ověřeno: v scripts/ není
          # jediné volání gitu), takže je to práce, která nic nestojí.
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PODLE ZÁMKU A BEZ INSTALAČNÍCH SKRIPTŮ. V téhle úloze je
      # service-role klíč k databázi, takže je to to poslední místo, kde
      # se má instalovat „co je právě na npm nejnovější". `npm ci` bere
      # verze z package-lock.json a --ignore-scripts nepustí životní
      # skripty balíčků. Hlídá scripts/test-ci-prava.mjs.
      - name: Závislosti (jpeg-js kvůli otiskům fotek)
        run: npm ci --no-audit --no-fund --omit=dev --ignore-scripts

      - name: Projít inzeráty
        run: node scripts/kontrola-inzeratu.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KONTROLA_LIMIT: ${{ github.event.inputs.limit || '200' }}

      # Úklid tabulek, které jinak jen rostou (návštěvnost starší dvou let,
      # záznamy o odeslané poště starší půl roku). Jede AŽ ZA kontrolou a
      # s `if: always()`, aby se pustil i tehdy, když kontrola inzerátů
      # spadne — nemají spolu nic společného, jen sdílejí jedno noční okno
      # a jeden klíč. Vlastní selhání úlohu neshodí: skript končí nulou a
      # případný problém hlásí jako ::warning::.
      - name: Úklid databáze
        if: always()
        run: node scripts/uklid-databaze.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # KDYŽ TO SPADNE, AŤ SE TO NĚKDO DOZVÍ. Bez tohohle kroku zůstane
      # po selhané noční úloze červená tečka v záložce Actions, kam se
      # nikdo nedívá. Zakládá jeden úkol na úlohu a další selhání k němu
      # jen připíše; sám nikdy nespadne, aby nepřebil tu první chybu.
      - name: Ohlásit selhání
        if: failure()
        uses: ./.github/actions/ohlas-selhani
        with:
          jmeno: Kontrola inzerátů a úklid databáze
          co-to-znamena: >-
            Neproběhla kontrola odkazů a fotek u inzerátů od lidí ani noční úklid databáze.
