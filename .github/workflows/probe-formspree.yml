name: probe-formspree
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Zkontrolovat, co servíruje NASAZENÝ web (config.js + verze)
        run: |
          echo "===== živý js/config.js na GitHub Pages ====="
          curl -sS "https://mhjrw9k8m4-cyber.github.io/Nemovitosti/js/config.js?nocache=$RANDOM" | grep -i "PK_FORM_ENDPOINT\|formspree" || echo "!! endpoint v config.js NENALEZEN (stará verze / nenasazeno)"
          echo
          echo "===== verze assetů v živém index.html ====="
          curl -sS "https://mhjrw9k8m4-cyber.github.io/Nemovitosti/?nocache=$RANDOM" | grep -o 'config.js?v=[0-9a-z]*\|main.js?v=[0-9a-z]*' | head
          echo
          echo "===== hlavičky (cache) živého config.js ====="
          curl -sS -I "https://mhjrw9k8m4-cyber.github.io/Nemovitosti/js/config.js" | grep -i "last-modified\|cache-control\|etag\|age" || true
