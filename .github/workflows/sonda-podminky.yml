name: Sonda podmínek

# Zjišťuje, co o automatickém přístupu říkají PODMÍNKY zdroje, u kterého
# „Sonda zdrojů" naměřila zákaz v robots.txt. Důvod je v docs/optimalizace.md
# §339: robots.txt mluví o automatickém procházení, kdežto náš stahovač
# posílá dotaz na rozhraní — a jestli to podmínky dovolují, robots.txt
# neříká. Majitel rozhodl: nejdřív zjistit podmínky.
#
# ČTENÍ PODMÍNEK SE SAMO ŘÍDÍ robots.txt a žádnou výjimku nemá. Když web
# čtení té cesty zakazuje, nestahuje se a do nálezu se napíše, že to nešlo.
# Pak ty podmínky musí otevřít člověk v prohlížeči — a je to tak správně.
#
# JEN NA VYŽÁDÁNÍ. Není to měření pro web, je to podklad k jednomu
# rozhodnutí. Žádný rozvrh, nejvýš pět dotazů na zdroj, pauza mezi nimi.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  podminky:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PROHLÍŽEČ, protože podmínky bývají skládané skriptem. Naměřeno
      # 3. 11.: Bezrealitky i elektronickedrazby.cz skončily na „málo
      # textu — vykresluje se až v prohlížeči". Verze je PŘIPNUTÁ ze
      # stejného důvodu jako u zkoušek: ať je zvednutí vidět v repozitáři.
      # Sonda ho pouští jen u stránky, která text nedala sama, a
      # robots.txt platí i pro každý podřízený soubor.
      - name: Prohlížeč
        run: |
          npm install --no-audit --no-fund --ignore-scripts playwright-core@1.64.1 playwright@1.64.1
          npx playwright install --with-deps chromium
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)"

      - name: Přečíst podmínky
        run: node scripts/sonda-podminky.mjs

      - name: Commit nálezu (jen pokud se něco změnilo)
        uses: ./.github/actions/commit-a-push
        with:
          zprava: "data: nález sondy podmínek"
          co: data/zdroje-podminky.json