name: Testy a kontrola kódu

# Pustí se na každý push a na každý pull request. Chytá dvě věci, které
# se jinak poznají až na živém webu:
#   1) překlep nebo volání funkce, která neexistuje (to byl případ
#      closeFeedback — chyba při každém stisku Escape),
#   2) rozbitou kontrolu zadaných údajů (testy v scripts/test-kontrola.mjs).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

# JEDEN BĚH NA VĚTEV. Běh v prohlížeči trvá přes půl hodiny, takže když
# během něj přijde další push, běžely dosud oba — a oba poslaly e-mail.
# Naměřeno: běhy 222 a 223 odstartovaly 29 sekund po sobě, 225 a 226 taky
# v jednom sledu. Starší běh se teď zruší; zrušený běh e-mail neposílá
# a verdikt stejně platí jen pro špičku větve, kterou měří ten novější.
# Pull requesty mají vlastní skupinu, ať si push a PR navzájem neruší běh.
concurrency:
  group: testy-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# NEJMENŠÍ POTŘEBNÁ PRÁVA. Bez tohohle bloku dostane úloha práva, která
# má repozitář nastavená ve svém nastavení — tedy něco, co v repozitáři
# vidět není a co se dá přepnout mimo historii. Tahle úloha nic
# nezapisuje (nekomituje, nepíše komentáře, nenahrává artefakty), takže
# jí stačí přečíst si zdroj. Hlídá to scripts/test-ci-prava.mjs.
permissions:
  contents: read

jobs:
  testy:
    # KAŽDÁ ZKOUŠKA DOBĚHNE, I KDYŽ SPADLA NĚKTERÁ PŘED NÍ.
    # GitHub Actions ruší po prvním neúspěšném kroku všechny za ním.
    # CI 888 mělo v každé směně jeden pád — a tři další zkoušky stály
    # až za nimi, takže se nespustily vůbec a objevily se teprve při
    # prvním souběžném běhu na stroji (viz docs/optimalizace.md §321).
    # Červené CI tím říkalo „tři vady", a pravda byla „šest".
    # `!cancelled()` pustí zkoušku i po cizím pádu; podmínka na
    # `priprava` ji naopak PŘESKOČÍ, když selhala příprava úlohy —
    # tam by stovky pádů nic neřekly, protože by chyběl prohlížeč
    # nebo by neprošla syntaxe.
    runs-on: ubuntu-latest
    # Strop proti visícímu spojení, ne proti pomalosti: bez něj
    # GitHub úlohu zastaví až po šesti hodinách a další
    # naplánovaný běh se do té doby nespustí (celá sada 115 + 121 zkoušek, místně kolem 45 minut).
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # TOKEN NEZŮSTÁVÁ NA DISKU. actions/checkout si ho jinak zapíše
          # do .git/config a leží tam po celou úlohu — a tady se pak
          # instalují balíčky z npm a pouští se stovky skriptů. Žádný
          # krok téhle úlohy s gitem nemluví (ověřeno: v scripts/ není
          # jediné volání gitu), takže je to práce, která nic nestojí.
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntaxe všech skriptů
        id: priprava
        run: |
          set -e
          for f in js/*.js scripts/*.mjs api/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
            echo "ok  $f"
          done

      - name: Odvozené soubory sedí se zdrojem (spraví je node scripts/oprav.mjs)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-oprav.mjs

      - name: Dotazy do databáze proti schématu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-sloupce.mjs

      - name: Statistika cen (čísla odpovídají skutečnosti)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-statistika.mjs

      # Měřidlo, kterým se rozhoduje o jádru webu, tvrdilo nepravdu:
      # varianta „okolí" vycházela o 2,6 p.b. lepší než živý model,
      # protože do srovnání brala i ceny stanovené úředně (SPÚ). Zelené
      # číslo ve prospěch nápadu je nejhorší druh vady — tahle zkouška
      # hlídá, že měřidlo měří zeměpis, a ne vstupní filtr.
      - name: Měřidlo přesnosti odhadu měří, co tvrdí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-mericka-odhadu.mjs

      # Nástroj, podle kterého se rozhodne „pustit, nebo nepustit".
      # Zkouší se proti PŘEDSTÍRANÉ Supabase v šesti stavech — hlavně
      # ten, kdy databáze neodpovídá: tehdy musí říct NEZKOUŠENO, ne
      # „nic nebrání". Sám nástroj v CI neběží; mluvil by s ostrým
      # projektem a červenal by podle toho, co ještě nikdo nenasadil.
      - name: Kontrola připravenosti ke spuštění měří, co tvrdí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kontrola-spusteni.mjs

      # Hlásič selhání nočních úloh. Zkouší se proti PŘEDSTÍRANÉMU
      # GitHubu: žádný opravdový úkol se nikde nezakládá. Nejdůležitější
      # z kontrol je ta, že při nedostupném GitHubu hlásič nemlčí.
      - name: Hlásič selhání nočních úloh
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ohlas-selhani.mjs
      # Hlásič NÁLEZU zkoušení portálů — druhý konec téhož pravidla:
      # měřidlo bez hlášení je měřidlo pro nikoho. Zkouší se proti
      # předstíranému GitHubu; nejdůležitější kontrola je ta, že se bez
      # nového nálezu úkol NEZAKLÁDÁ (opakovaný úkol nikdo neotevírá).
      - name: Hlásič nálezu zkoušení portálů
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ohlas-nalez.mjs
      - name: Čísla na okresních stránkách se přepočítají z dat
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-cisla-okresu.mjs
      # Titulek je ve výsledcích hledání jediné, co člověk před
      # klepnutím vidí, a věta „Ceny od" jediné číslo. Obojí se dřív
      # skládalo napevno ze slova „pozemky" a z nejnižší ceny vůbec —
      # viz zdůvodnění v té zkoušce (Praha: 31 pozemků ze 780; Tábor:
      # slib 20 000 Kč proti nejlevnější celé nemovitosti za 132 031).
      - name: Titulek a věta o cenách nelžou o obsahu okresní stránky
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-titulek-mnoziny.mjs
      - name: Změna ceny nesmí nabídce sebrat věk
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-prvni-videno.mjs
      - name: Víc pozemků na jednom místě (shluky nabídek)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-bloky.mjs
      - name: Co o webu ví vyhledávač (sirotci, indexovatelnost)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vyhledavac.mjs
      - name: Srovnatelné pozemky — pořadí sedí na vypsaný seznam
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-srovnatelne.mjs

      - name: Kontrola databáze opravdu kontroluje (nad předstíranou Supabase)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kontrola-databaze.mjs

      - name: Cena ve strukturovaných datech sedí a nelže o dražbě
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-nabidka-pro-stroje.mjs

      - name: „Na co mám?" — počty sedí na skutečné nabídky
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-rozpocet.mjs
      - name: Stránky „Pozemky do X Kč" vypisují to, co tvrdí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-rozpocet-stranky.mjs
      - name: „Co je nového" nevydává starou nabídku za novou
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-nove-pozemky.mjs
      - name: Stránka si nestahuje skript, který na ní nemá co dělat
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-skripty-na-strance.mjs
      - name: Řádek výpisu neopakuje, co už jinde stojí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vypis-radku.mjs
      - name: „Pozemky v okolí" opravdu vedou do okolí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-okoli-okresu.mjs
      - name: Rozcestník „Kam dál" na stránce pozemku
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kam-dal.mjs
      - name: U spoluvlastnického podílu to stojí v názvu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-podil-v-nazvu.mjs

      - name: Pořadí nabídek (nic nezapadne)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-poradi.mjs

      - name: Hledání (háčky, pořadí slov, druh pozemku)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hledani.mjs

      - name: Rozbitá data (náhodné zatěžkávání výpočtů)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-nahodne.mjs


      - name: Co je u pozemku (čtení sítí a podílu z popisu)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vybaveni.mjs

      - name: Výměra přečtená z textu inzerátu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vymera-z-textu.mjs

      - name: Slepená výměra — číslo se nesmí přilepit k počtu pokojů (§462)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-slepena-vymera.mjs

      - name: Objednávka u Apify a kontrola odpovědi (§463)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-sreality-objednavka.mjs

      - name: Dražební zdroj čtený podle předpisu (§464)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zdroj-predpisem.mjs

      - name: Druh pozemku z textu inzerátu (kus slova, zápor, název obce)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-druh.mjs

      - name: Kategorie nemovitosti z textu (přednosti, jméno obce, jméno webu)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kategorie.mjs

      - name: Hledání celou větou (druh, cena, sítě v jednom políčku)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-dotaz.mjs

      - name: Hlídač jednotlivých zdrojů (tiše spadlý zdroj)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hlidac-zdroju.mjs

      - name: Mezipaměť geokodéru si nepamatuje „nevím" jako „neexistuje"
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-geokoder-pamet.mjs

      - name: Čtení PDF přečte text a přizná, co neumí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-cti-pdf.mjs

      - name: Nabídky nepotřebného majetku státu (otevřené CSV)
        run: node scripts/test-nabidky-statu.mjs

      - name: ÚZSVM — a hlavně že se pacht nevydává za prodej
        run: node scripts/test-uzsvm.mjs

      - name: Výběr prodejů — ať se žádný zdroj neztratí
        run: node scripts/test-vyber-prodeje.mjs

      - name: Hledání nových zdrojů (rejstřík lokálních katalogů)
        run: node scripts/test-hledej-zdroje.mjs

      - name: Zkoušení portálů (všechny cesty a spojení dál)
        run: node scripts/test-zkus-portal.mjs

      - name: Klíč, který zná jen zkouška (§438)
        run: node scripts/test-pouziti-klicu.mjs

      - name: Samorozvoj — nálezce, sabotážní stroj a smyčka
        run: node scripts/test-samorozvoj.mjs

      - name: Ohledávací nástroj (hledání v obsahu na všech cestách)
        run: node scripts/test-ohledej.mjs

      - name: Zdroj mimo pořádek 3× v řadě se ozve (nezůstane zelený)
        run: node scripts/test-hlidka-zdroju.mjs

      - name: Stahování ze zdrojů (opakování, Retry-After, časový limit)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-stahovani.mjs

      - name: Dvojí kopie téže funkce na jedné stránce
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kopie-funkci.mjs

      - name: Noční úklid databáze (nespadne a nevyzradí klíč)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-uklid-databaze.mjs

      - name: Dražby z otevřených dat CEVD (výměra celé položky)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-drazby-cevd.mjs

      - name: Odhad ceny na regionálních stránkách
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-odhad-regiony.mjs

      - name: Historie ceny nabídky (zlevnil majitel?)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ceny-historie.mjs

      - name: Časová řada cenových hladin
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-historie-cen.mjs

      - name: Věta o změně ceny
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zlevneni.mjs

      - name: Okruh kolem místa (do 30 km od Brna)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-okruh.mjs

      - name: Kraj podle polohy (obálka nesmí změnit odpověď)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kraje-geometrie.mjs

      - name: Čísla na stránce okresu (podíly, kde je nabídek nejvíc)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-okres-stranka.mjs

      - name: Bonita půdy (BPEJ) — dotaz na bod a čtení odpovědi
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-bpej.mjs

      - name: Místem nabídky je obec, ne ulice
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-misto-inzeratu.mjs

      - name: Bezrealitky se čtou povolenou cestou (sitemapa + detail)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-bezrealitky.mjs

      - name: Cena za metr nad stropem uvěřitelnosti se netvrdí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-strop-ceny.mjs

      - name: Podklad pro kupní smlouvu (částka slovy, označení pozemku)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-smlouva.mjs

      - name: Odkazy na zdroj nabídky slibují, kam vedou
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zdroje-odkazu.mjs

      - name: Stránky podle druhu pozemku (les, orná, stavební…)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-druh-stranka.mjs

      - name: Razítka verzí (aby lidem nechodila stará kopie)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-verze.mjs

      - name: Platnost datových souborů
        run: |
          set -e
          for f in data/*.json manifest.webmanifest vercel.json package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
            echo "ok  $f"
          done

      - name: Kontroly zadaných údajů
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kontrola.mjs

      - name: Meze platí v prohlížeči i na serveru
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-meze.mjs

      - name: Placené zvýraznění (za peníze se musí něco stát)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-platba.mjs

      - name: Čtení EXIFu a původ fotek
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-exif.mjs

      - name: Rozpoznání obsahu fotek
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-fototema.mjs

      - name: Opakovaná kontrola odkazů a fotek
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-opakovana.mjs

      - name: Psaní v aplikaci (logika schránky a odznaku)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zpravy.mjs

      - name: Hlídání lokality (co je nový pozemek)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hlidani.mjs


      - name: Celá kontrola inzerátů (proti zkušebnímu serveru)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: |
          # PODLE ZÁMKU A BEZ INSTALAČNÍCH SKRIPTŮ. `npm install jpeg-js`
          # jmenuje balíček, takže si verzi vybere znovu podle ^0.4.4 —
          # package-lock.json u toho neplatí. `npm ci` nainstaluje přesně
          # to, co je v zámku, a --ignore-scripts nepustí životní skripty
          # balíčků (dnes žádný takový nemáme, ale nová verze ho přidat
          # může a spustila by se bez čtení). Hlídá scripts/test-ci-prava.mjs.
          npm ci --no-audit --no-fund --omit=dev --ignore-scripts
          node scripts/test-kontrola-e2e.mjs

      # Nestačí, že se soubory sečtou — musí z nich jít databázi opravdu
      # založit. Když se to poprvé zkusilo, vysypalo to šest chyb a na
      # novém projektu vůbec nevznikly funkce pro zprávy.
      # PK_SQL_VYZADOVAN: bez PostgreSQL se zkouška PŘESKAKUJE, a to je
      # v pořádku u člověka, ne tady. Instalace končí „|| true", takže
      # kdyby se balíček nestáhl, úloha by zeleně prošla a nejsilnější
      # kontrola databáze by tiše nehlídala nic. S touhle proměnnou
      # chybějící PostgreSQL úlohu shodí.
      - name: Databáze jde založit na čistém PostgreSQL
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        env:
          PK_SQL_VYZADOVAN: '1'
        run: |
          # PŘED 8. 11. 2026 TU BYLO `>/dev/null 2>&1 || true`, a to byla
          # chyba: když se apt nepovedl, nebylo z protokolu poznat PROČ —
          # jen pak tři zkoušky spadly na „PostgreSQL tu není". Přesně to
          # se dnes v bězích 1076 a 1081 stalo. Instalace proto mluví.
          # A nejdřív se podívá, jestli už v obrazu běžce není: zkoušky
          # si server pouštějí samy (scripts/zkouska-postgres.mjs hledá
          # /usr/lib/postgresql/*/bin/initdb), takže stačí binárky.
          if ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            echo "PostgreSQL je v obrazu běžce: $(ls -d /usr/lib/postgresql/*)"
          else
            echo "PostgreSQL v obrazu není, doinstalovávám:"
            # `update` PŘED instalací: bez něj apt nemusí mít seznamy
            # balíčků a „install postgresql" skončí za sekundu na
            # „Unable to locate package" — tak vypadalo selhání
            # v bězích 1076 a 1081.
            sudo apt-get update \
              || echo "::warning::apt-get update selhal — instalace to zkusí i tak."
            sudo apt-get install -y --no-install-recommends postgresql \
              || echo "::warning::apt-get postgresql selhal — viz výpis výš. Zkoušky to ohlásí jako chybu, ne jako přeskočení."
            ls -d /usr/lib/postgresql/* 2>/dev/null \
              || echo "::warning::po instalaci v /usr/lib/postgresql pořád nic není."
          fi
          node scripts/test-sql-cista.mjs

      # A nestačí, že se databáze založí — musí i snést objem. Měřeno
      # scripts/mericka-databaze.mjs: jedna noční úloha trvala 23,8 s,
      # protože se u každé fotky ptala napříč všemi inzeráty. Tahle
      # zkouška vyrobí vedle živé podoby tu pomalou a porovná POMĚREM,
      # takže na rychlejším ani pomalejším stroji nepláče zbytečně.
      # Běží ve stejném kroku jako zkouška výš, aby se PostgreSQL
      # instaloval jen jednou.
      - name: Databáze snese objem
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        env:
          PK_SQL_VYZADOVAN: '1'
        run: node scripts/test-sql-vykon.mjs

      # Hlášení chyb z prohlížečů návštěvníků: polovina zkoušky pustí
      # js/chyby.js v Node s podstrčeným oknem, druhá polovina ověří na
      # opravdovém PostgreSQL, že databáze sama odmítne hlášku
      # s e-mailem a že denní strop sepne. Proto je ve stejném kroku
      # jako zkoušky výš — PostgreSQL je už nainstalovaný.
      - name: Hlášení chyb z prohlížeče (co se pošle a co databáze pustí)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        env:
          PK_SQL_VYZADOVAN: '1'
        run: node scripts/test-chyby-klienta.mjs

      - name: Jedno pravidlo pro všechno, co web odesílá sám
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-neosobni.mjs

      # Automat, který smí commitovat, je nebezpečný přesně tak, jak jsou
      # slabá jeho pravidla. Tady se zkouší každé zvlášť — bez gitu
      # a bez GitHubu, protože rozhodování je v čisté funkci.
      - name: Sebeoprava opraví jen to, co opravit smí
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-sebeoprava.mjs

      # Hlídač, který svítí zeleně na rozbitý web, je horší než žádný.
      # Měří se na podstrčeném webu, který se schválně kazí.
      - name: Kontrola nasazení pozná, že venku není to, co má být
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kontrola-nasazeni.mjs

      - name: Souhrnné SQL odpovídá dílčím souborům
        run: |
          node scripts/build-sql.mjs
          if ! git diff --quiet -- supabase/00-vse.sql; then
            echo "::error::supabase/00-vse.sql neodpovídá souborům v supabase/. Spusťte 'node scripts/build-sql.mjs' a commitněte výsledek."
            git diff --stat -- supabase/00-vse.sql
            exit 1
          fi
          echo "ok  supabase/00-vse.sql je aktuální"

      - name: Statická kontrola skriptů
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-staticka.mjs

      - name: Inzerát jde na mapu hned (žádné čekání na schválení)
