      - name: Graf všude (křivka vývoje ceny na každém druhu stránky pozemku)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-graf-vsude.mjs

      - name: Jedna barva v řadě odznaků pod cenou na kartě
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-jedna-barva.mjs

      - name: Vzhled profilu (sedí „Můj profil" ke zbytku webu)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-profil-vzhled.mjs

      - name: Hlídání jako hledání (jeden recept na jednu roli)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hlidani-jako-hledani.mjs

      - name: Tip na dobrou koupi je táž karta jako ve výpisu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-tip-jako-karta.mjs


      - name: Chyby skriptů a přetékání na všech druzích stránek
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-konzole.mjs

      - name: Druh příležitosti se pozná i bez barev
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-tvary.mjs

      - name: Klíč k mapě patří k mapě (zarovnání a dva sloupce)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-legenda-mapy.mjs

      - name: Cena podle druhu (sdílená stupnice nelže)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-cena-podle-druhu.mjs

      - name: Okolí — dlaždice okruhu nesou počty
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-okoli-dlazdice.mjs

      - name: Okolí — obec bez nabídek se najde na mapě
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-okoli-jinde.mjs

      - name: Šipka zpět na mapě nevyhodí z webu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zpet-mapa.mjs

      - name: Tři moduly se stahují až při prvním použití
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-odlozene-skripty.mjs

      - name: Výpis nečeká na mapovou knihovnu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vypis-bez-mapy.mjs

      - name: Hierarchie tlačítek (co je tu hlavní?)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hierarchie.mjs

      - name: Pořadí na stránce pozemku (důležité nahoře)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-poradi-pozemku.mjs

      - name: Vyhledávač cen podle lokality
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ceny-hledani.mjs

      - name: Křížek na skrytí je na kartě vidět
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-skryt-videt.mjs

      - name: Uložené pozemky na účtu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ulozene-ucet.mjs

      - name: Hláška o hlídání jen tomu, kdo si ho nastavil
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hlaska-hlidani.mjs

      - name: Poznámka pozemek uloží mezi vaše
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-pozn-oblibene.mjs

      - name: Výklad na úvodní stránce se rozbaluje
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-dobre-vedet.mjs

      - name: Co z uložených odešlo z nabídky
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zmizele.mjs

      - name: Moje data — co si web pamatuje
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ulozene.mjs


  v-prohlizeci-3:
    # KAŽDÁ ZKOUŠKA DOBĚHNE, I KDYŽ SPADLA NĚKTERÁ PŘED NÍ.
    # GitHub Actions ruší po prvním neúspěšném kroku všechny za ním.
    # CI 888 mělo v každé směně jeden pád — a tři další zkoušky stály
    # až za nimi, takže se nespustily vůbec a objevily se teprve při
    # prvním souběžném běhu na stroji (viz docs/optimalizace.md §321).
    # Červené CI tím říkalo „tři vady", a pravda byla „šest".
    # `!cancelled()` pustí zkoušku i po cizím pádu; podmínka na
    # `priprava` ji naopak PŘESKOČÍ, když selhala příprava úlohy —
    # tam by stovky pádů nic neřekly, protože by chyběl prohlížeč
    # nebo by neprošla syntaxe.
    runs-on: ubuntu-latest
    # Strop proti visícímu spojení, ne proti pomalosti: bez něj GitHub
    # úlohu zastaví až po šesti hodinách a další naplánovaný běh se do
    # té doby nespustí. Směna má naměřeno kolem 20 minut, strop je
    # tedy víc než dvojnásobek — 3. směna (44 zkoušek).
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # TOKEN NEZŮSTÁVÁ NA DISKU. actions/checkout si ho jinak zapíše
          # do .git/config a leží tam po celou úlohu — a tady se pak
          # instalují balíčky z npm a pouští se stovky skriptů. Žádný
          # krok téhle úlohy s gitem nemluví (ověřeno: v scripts/ není
          # jediné volání gitu), takže je to práce, která nic nestojí.
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prohlížeč
        id: priprava
        run: |
          # PŘIPNUTÁ VERZE. Dřív tu stálo `playwright-core playwright` bez
          # verze, takže se instalovalo to, co bylo na npm nejnovější
          # v minutě běhu — jednou to rozsvítilo CI při zelené zkoušce
          # (oddíl 101: page.accessibility v 1.64 neexistuje). Zvednout
          # verzi je od teď změna v repozitáři, kterou je vidět.
          # --ignore-scripts: prohlížeč se stahuje až příkazem pod tím,
          # ne životním skriptem balíčku.
          # SÍŤ RUNNERU UMÍ VYPADNOUT, A JEDEN POKUS NESTAČÍ. Běh 1147 padl
          # ve všech třech směnách naráz na `Temporary failure resolving
          # 'archive.ubuntu.com'` — apt skončil kódem 100, `playwright
          # install` s ním a ŽÁDNÁ zkouška se nespustila. Není to vada webu
          # ani zkoušky, takže se zkouší třikrát (odstup 30 a 60 s). Když
          # síť nenaskočí ani potom, krok padne a v logu stojí proč.
          # Příkaz zůstává na JEDNOM řádku: hlídač práv v CI (test-ci-prava)
          # čte instalaci balíčků po řádcích a zalomení zpětným lomítkem
          # mu ten řádek rozpůlí — hlásil pak „balíček \ bez verze".
          for pokus in 1 2 3; do
            if npm install --no-audit --no-fund --ignore-scripts playwright-core@1.64.1 playwright@1.64.1 && npx playwright install --with-deps chromium; then break; fi
            if [ "$pokus" = 3 ]; then
              echo "Prohlížeč se nepodařilo nainstalovat ani na třetí pokus (viz chyby výš)."
              exit 1
            fi
            echo "Pokus $pokus selhal — nejčastěji síť runneru. Zkouším znovu."
            sleep $((pokus * 30))
          done
          # Verze zůstává v logu: hádat se o příčině červené CI se nemá
          # podle dojmu, ale podle čísla, které je vidět na první pohled.
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)" 
      - name: Kontrola fotek (že běží a odkud se bere)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kontrola-fotek.mjs

      - name: Barevné odznaky jsou čitelné v obou režimech
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-odznaky.mjs

      - name: Zkrácený stylopis vypadá jako plný (vypočtené styly)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-rozdeleni-stylu.mjs

      - name: Sekce o chování trhu sedí na archiv
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-trh-sekce.mjs

      - name: Filtr „Zlevněné" ukazuje právě to, co zlevnilo
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zlevnene-filtr.mjs

      - name: Karta vede na svůj pozemek, ne na dvojče
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-karta-vede-spravne.mjs

      - name: Řazení výpisu (každá volba dělá, co slibuje)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-razeni.mjs

      - name: Rozvržení na všech šířkách a popisky stránek
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-rozvrzeni.mjs

      - name: Mapový podklad (tlumený, ale ne vybělený)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-podklad.mjs

      - name: Verdikt u spoluvlastnického podílu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-verdikt-podilu.mjs

      - name: Ikony (jedna sada, jedna tloušťka)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ikony.mjs

      - name: Šipka zpět nad vrstvou (zavírá, neodchází ze stránky)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zpet.mjs

      - name: Plynulost startu mapy (není to jedna dlouhá úloha)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-plynulost.mjs

      - name: Prázdno pod obsahem a kotvy pod hlavičkou
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-prazdno.mjs

      - name: Paměť prohlížeče (nové od minule, skryté, filtr)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-pamet.mjs

      - name: Ztlumené okolí mapy
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-maska.mjs

      # Jeden krok na celém webu. Měří VYKRESLENÉ stránky, ne zápis
      # v souboru: hodnoty se slévají z tokenů, media queries a tří
      # stylopisů naráz. Zrovna na tom pohořel test-pismo.mjs — hlídal
      # čtením css/styles.css a 2 266 stránek pravidlo porušovalo.
      - name: Jednotný krok webu (okraj, nadpis, karta)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-jednotnost.mjs

      - name: První obrazovka telefonu (je vidět nabídka, ne jen ovládání)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-prvni-obrazovka.mjs

      - name: Tlačítko „Zpět na pozemky" (je všude a všude stejné)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zpet-tlacitko.mjs

      - name: Stránky účtu (obsah na středu, ne přilepený vlevo)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-stranky-uctu.mjs

      - name: Zapomenuté heslo je ze všech čtyř přihlášení
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zapomenute-heslo.mjs

      - name: Podklad hlavní mapy
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-podklad-mapy.mjs

      - name: Žádné překreslení výpisu navíc
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-jedno-vykresleni.mjs

      - name: Ovládání nad výpisem má jednu velikost
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ovladani-vypisu.mjs

      - name: Buď u kraje, nebo s okrajem
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-u-hrany.mjs

      - name: Stránka vyřazené nabídky je taky stránka
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vyrazena-nabidka.mjs

      - name: Odznak u ceny říká totéž co verdikt
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-cenovy-stupen.mjs

      - name: Souřadnice pozemku s sebou
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-souradnice.mjs

      - name: Hlídání okruhu od místa
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-okruh-hlidani.mjs

      # Obě si berou prohlížeč importem hned v hlavičce. Vznikly spolu
      # s histogramem cen a zapsaly se do rychlé úlohy „testy", kde se
      # Playwright neinstaluje — tedy do úlohy, kde nemohly udělat nic
      # než padnout na chybějícím balíčku a vzít s sebou celý běh.
      # Tutéž chybu už kdysi udělal test-verdikt.mjs a právě proto to
      # hlídá scripts/test-staticka.mjs. Ta zkouška chybu našla hned;
      # jen se k ní dva dny nikdo nedostal, protože moje místní sada
      # ji přeskakovala podle slova „playwright" v komentáři.
      - name: Stránky s účtem nejde vložit do cizího rámu
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ramovani.mjs

      - name: Cizí text se vykreslí jako text, ne jako kód
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-escape-dom.mjs

      - name: Čtení prohlížečem drží robots.txt
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-cti-prohlizecem.mjs

      - name: Diagnostika vykreslí nálezy sond
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-diagnostika-zdroje.mjs

      - name: Kontrast textu (WCAG AA)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kontrast.mjs

      - name: Kalkulačka hypotéky
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hypoteka.mjs

      - name: Míra sazby (znaků na řádku)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-mira.mjs

      - name: Mapová knihovna se stahuje až na dohled
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-leaflet.mjs

      - name: Uložení jednoho pozemku neoznačí sousedy
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-klic-ulozenych.mjs

      - name: Vrstvy úřadů na hlavní mapě (až na vyžádání)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vrstvy-mapa.mjs

      - name: Barvy kategorií (jeden zdroj pro mapu i karty)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-barvy.mjs

      - name: Lepivá hlavička (drží nahoře, menu se otevře)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hlavicka.mjs

      - name: Jméno třídy je slib, že existuje pravidlo
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-mrtva-jmena.mjs

      - name: Hláška se ohlásí — živá oblast je ve stromu dřív než text
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ohlaseni.mjs

      - name: Obecní záměr — celá cesta od dat po detail
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-obec.mjs

      - name: Barvy po najetí myší
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-najeti.mjs

      - name: Na ovládání je vidět, že je ovládání
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-afordance.mjs

      - name: Sliby webu platí doopravdy
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-sliby.mjs

      - name: Okno „Vyberte své okolí"
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-vyber-okoli.mjs

      - name: Pomalá databáze nedrží výpis
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-zive-strop.mjs

      - name: Vyhledávání pozemků má jeden vzhled
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hledani-vzhled.mjs

      - name: Zakliknutí filtru neposune stránku pod rukou
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-bez-skoku.mjs

      - name: Karta nabídky se čte stejně na všech typech stránek
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-karta-nabidky.mjs


      - name: Značka „už otevřeno"
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-videno.mjs

      - name: Otevřený panel filtrů se zase zavře
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-hledani-zavirani.mjs

      # Pustí kontrolu živého webu proti FALEŠNÉMU webu, na kterém se
      # každá vada vyrobí schválně. Bez toho by to byl hlídač, u kterého
      # nikdo nedokázal, že vadu pozná.
      - name: Kontrola živého webu pozná každou vadu, kvůli které vznikla
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-kontrola-ziva.mjs

