  # Všechno, co potřebuje opravdový prohlížeč: chat, mapa, hlavička,
  # kontrast, dotykové terče, výpadky… Běží zvlášť od rychlých testů, aby
  # se kvůli stahování Chromia nečekalo na každou drobnost. Kroky, které
  # prohlížeč potřebují, musí být V TOMHLE jobu — jinde se neinstaluje.
  # ---- ZKOUŠKY V PROHLÍŽEČI: DVĚ SMĚNY VEDLE SEBE -------------------
  # Jedna úloha jela celou sadu za sebou: naměřeno 59 minut 26 sekund
  # (běh 554) proti stropu 75 minut, tedy čtvrt hodiny rezervy na
  # pomalejší stroj. Zároveň to znamenalo, že se verdikt dozví člověk
  # až za hodinu. Sada je proto rozdělená na dvě směny, které běží
  # současně — každá kolem 31 minut (rozděleno podle NAMĚŘENÝCH délek
  # jednotlivých zkoušek, ne podle počtu: test-rozvrzeni a test-okoli
  # samy zaberou 5 minut, zatímco většina zkoušek doběhne do 20 s).
  # Chromium se instaluje dvakrát (asi minuta), to se vyplatí.
  # Když se zkouška přidá, patří do té směny, která je kratší; na obě
  # dohlíží scripts/test-staticka.mjs (každá zkouška právě jednou)
  # a scripts/test-roadmap.mjs (počty v README).


  v-prohlizeci:
    # KAŽDÁ ZKOUŠKA DOBĚHNE, I KDYŽ SPADLA NĚKTERÁ PŘED NÍ.
    # GitHub Actions ruší po prvním neúspěšném kroku všechny za ním.
    # CI 888 mělo v každé směně jeden pád — a tři další zkoušky stály
    # až za nimi, takže se nespustily vůbec a objevily se teprve při
    # prvním souběžném běhu na stroji (viz docs/optimalizace.md §321).
    # Červené CI tím říkalo „tři vady", a pravda byla „šest".
    # `!cancelled()` pustí zkoušku i po cizím pádu; podmínka na
    # `priprava` ji naopak PŘESKOČÍ, když selhala příprava úlohy —
    # tam by stovky pádů nic neřekly, protože by chyběl prohlížeč
    # nebo by neprošla syntaxe.
    runs-on: ubuntu-latest
    # Strop proti visícímu spojení, ne proti pomalosti: bez něj GitHub
    # úlohu zastaví až po šesti hodinách a další naplánovaný běh se do
    # té doby nespustí. Směna má naměřeno kolem 20 minut, strop je
    # tedy víc než dvojnásobek — 1. směna (43 zkoušek).
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
