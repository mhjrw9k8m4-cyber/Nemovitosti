      - name: Jeden ovladač (velikost a řez písma tlačítek na celém webu)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
        run: node scripts/test-ovladace.mjs

      - name: Odkryté stavy (zaoblení i tam, kam se hlídači nedostanou)
        if: ${{ !cancelled() && steps.priprava.outcome == 'success' }}
