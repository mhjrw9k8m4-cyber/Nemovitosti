  v-prohlizeci-2:
    # KAŽDÁ ZKOUŠKA DOBĚHNE, I KDYŽ SPADLA NĚKTERÁ PŘED NÍ.
    # GitHub Actions ruší po prvním neúspěšném kroku všechny za ním.
    # CI 888 mělo v každé směně jeden pád — a tři další zkoušky stály
    # až za nimi, takže se nespustily vůbec a objevily se teprve při
    # prvním souběžném běhu na stroji (viz docs/optimalizace.md §321).
    # Červené CI tím říkalo „tři vady", a pravda byla „šest".
    # `!cancelled()` pustí zkoušku i po cizím pádu; podmínka na
    # `priprava` ji naopak PŘESKOČÍ, když selhala příprava úlohy —
    # tam by stovky pádů nic neřekly, protože by chyběl prohlížeč
    # nebo by neprošla syntaxe.
    runs-on: ubuntu-latest
    # Strop proti visícímu spojení, ne proti pomalosti: bez něj GitHub
    # úlohu zastaví až po šesti hodinách a další naplánovaný běh se do
    # té doby nespustí. Směna má naměřeno kolem 20 minut, strop je
    # tedy víc než dvojnásobek — 2. směna (43 zkoušek).
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # TOKEN NEZŮSTÁVÁ NA DISKU. actions/checkout si ho jinak zapíše
          # do .git/config a leží tam po celou úlohu — a tady se pak
          # instalují balíčky z npm a pouští se stovky skriptů. Žádný
          # krok téhle úlohy s gitem nemluví (ověřeno: v scripts/ není
          # jediné volání gitu), takže je to práce, která nic nestojí.
