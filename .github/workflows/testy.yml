name: Testy a kontrola kódu

# Pustí se na každý push a na každý pull request. Chytá dvě věci, které
# se jinak poznají až na živém webu:
#   1) překlep nebo volání funkce, která neexistuje (to byl případ
#      closeFeedback — chyba při každém stisku Escape),
#   2) rozbitou kontrolu zadaných údajů (testy v scripts/test-kontrola.mjs).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

# JEDEN BĚH NA VĚTEV. Běh v prohlížeči trvá přes půl hodiny, takže když
# během něj přijde další push, běžely dosud oba — a oba poslaly e-mail.
# Naměřeno: běhy 222 a 223 odstartovaly 29 sekund po sobě, 225 a 226 taky
# v jednom sledu. Starší běh se teď zruší; zrušený běh e-mail neposílá
# a verdikt stejně platí jen pro špičku větve, kterou měří ten novější.
# Pull requesty mají vlastní skupinu, ať si push a PR navzájem neruší běh.
concurrency:
  group: testy-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntaxe všech skriptů
        run: |
          set -e
          for f in js/*.js scripts/*.mjs api/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
            echo "ok  $f"
          done

      - name: Odvozené soubory sedí se zdrojem (spraví je node scripts/oprav.mjs)
        run: node scripts/test-oprav.mjs

      - name: Dotazy do databáze proti schématu
        run: node scripts/test-sloupce.mjs

      - name: Statistika cen (čísla odpovídají skutečnosti)
        run: node scripts/test-statistika.mjs

      - name: Pořadí nabídek (nic nezapadne)
        run: node scripts/test-poradi.mjs

      - name: Hledání (háčky, pořadí slov, druh pozemku)
        run: node scripts/test-hledani.mjs

      - name: Rozbitá data (náhodné zatěžkávání výpočtů)
        run: node scripts/test-nahodne.mjs

      - name: Posuvník ceny a výměry (stupnice a histogram)
        run: node scripts/test-rozsah.mjs

      - name: Co je u pozemku (čtení sítí a podílu z popisu)
        run: node scripts/test-vybaveni.mjs

      - name: Výměra přečtená z textu inzerátu
        run: node scripts/test-vymera-z-textu.mjs

      - name: Druh pozemku z textu inzerátu (kus slova, zápor, název obce)
        run: node scripts/test-druh.mjs

      - name: Hledání celou větou (druh, cena, sítě v jednom políčku)
        run: node scripts/test-dotaz.mjs

      - name: Hlídač jednotlivých zdrojů (tiše spadlý zdroj)
        run: node scripts/test-hlidac-zdroju.mjs

      - name: Dražby z otevřených dat CEVD (výměra celé položky)
        run: node scripts/test-drazby-cevd.mjs

      - name: Odhad ceny na regionálních stránkách
        run: node scripts/test-odhad-regiony.mjs

      - name: Historie ceny nabídky (zlevnil majitel?)
        run: node scripts/test-ceny-historie.mjs

      - name: Časová řada cenových hladin
        run: node scripts/test-historie-cen.mjs

      - name: Věta o změně ceny
        run: node scripts/test-zlevneni.mjs

      - name: Okruh kolem místa (do 30 km od Brna)
        run: node scripts/test-okruh.mjs

      - name: Kraj podle polohy (obálka nesmí změnit odpověď)
        run: node scripts/test-kraje-geometrie.mjs

      - name: Čísla na stránce okresu (podíly, kde je nabídek nejvíc)
        run: node scripts/test-okres-stranka.mjs

      - name: Bonita půdy (BPEJ) — dotaz na bod a čtení odpovědi
        run: node scripts/test-bpej.mjs

      - name: Místem nabídky je obec, ne ulice
        run: node scripts/test-misto-inzeratu.mjs

      - name: Cena za metr nad stropem uvěřitelnosti se netvrdí
        run: node scripts/test-strop-ceny.mjs

      - name: Podklad pro kupní smlouvu (částka slovy, označení pozemku)
        run: node scripts/test-smlouva.mjs

      - name: Odkazy na zdroj nabídky slibují, kam vedou
        run: node scripts/test-zdroje-odkazu.mjs

      - name: Stránky podle druhu pozemku (les, orná, stavební…)
        run: node scripts/test-druh-stranka.mjs

      - name: Razítka verzí (aby lidem nechodila stará kopie)
        run: node scripts/test-verze.mjs

      - name: Platnost datových souborů
        run: |
          set -e
          for f in data/*.json manifest.webmanifest vercel.json package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
            echo "ok  $f"
          done

      - name: Kontroly zadaných údajů
        run: node scripts/test-kontrola.mjs

      - name: Meze platí v prohlížeči i na serveru
        run: node scripts/test-meze.mjs

      - name: Placené zvýraznění (za peníze se musí něco stát)
        run: node scripts/test-platba.mjs

      - name: Čtení EXIFu a původ fotek
        run: node scripts/test-exif.mjs

      - name: Rozpoznání obsahu fotek
        run: node scripts/test-fototema.mjs

      - name: Opakovaná kontrola odkazů a fotek
        run: node scripts/test-opakovana.mjs

      - name: Psaní v aplikaci (logika schránky a odznaku)
        run: node scripts/test-zpravy.mjs

      - name: Hlídání lokality (co je nový pozemek)
        run: node scripts/test-hlidani.mjs

      - name: Centrum upozornění (věty, čas, seskupení)
        run: node scripts/test-upozorneni.mjs

      - name: Celá kontrola inzerátů (proti zkušebnímu serveru)
        run: |
          npm install --no-audit --no-fund --omit=dev jpeg-js
          node scripts/test-kontrola-e2e.mjs

      # Nestačí, že se soubory sečtou — musí z nich jít databázi opravdu
      # založit. Když se to poprvé zkusilo, vysypalo to šest chyb a na
      # novém projektu vůbec nevznikly funkce pro zprávy.
      - name: Databáze jde založit na čistém PostgreSQL
        run: |
          sudo apt-get install -y --no-install-recommends postgresql >/dev/null 2>&1 || true
          node scripts/test-sql-cista.mjs

      - name: Souhrnné SQL odpovídá dílčím souborům
        run: |
          node scripts/build-sql.mjs
          if ! git diff --quiet -- supabase/00-vse.sql; then
            echo "::error::supabase/00-vse.sql neodpovídá souborům v supabase/. Spusťte 'node scripts/build-sql.mjs' a commitněte výsledek."
            git diff --stat -- supabase/00-vse.sql
            exit 1
          fi
          echo "ok  supabase/00-vse.sql je aktuální"

      - name: Statická kontrola skriptů
        run: node scripts/test-staticka.mjs

      - name: Sazba (jednoznaková slova na konci řádku)
        run: node scripts/test-sazba.mjs

      - name: Vizuální jazyk (hloubka a tvary z předlohy)
        run: node scripts/test-predloha.mjs

      - name: Mlčky přebité třídy ve stylopisu
        run: node scripts/test-prebiti.mjs

      - name: Popisy od inzerentů (úklid a doručení na stránku)
        run: node scripts/test-popisy.mjs

      - name: Vývoz nabídek do tabulky
        run: node scripts/test-vyvoz.mjs

      - name: Stav mapy v adrese (sdílené odkazy)
        run: node scripts/test-odkaz.mjs

      - name: Skloňování podle počtu
        run: node scripts/test-sklonovani.mjs

      - name: Jedna barevná teplota (závoje a stíny)
        run: node scripts/test-odstiny.mjs

      - name: Tokeny stylu (žádná odvolávka na nic)
        run: node scripts/test-tokeny.mjs

      - name: Typografická stupnice
        run: node scripts/test-typografie.mjs

      - name: Vložený styl na stránce pozemku
        run: node scripts/test-vlozeny-styl.mjs

      - name: Kanál s novými pozemky
        run: node scripts/test-rss.mjs

      - name: Popis dat odpovídá datům
        run: node scripts/test-data-rozhrani.mjs

      - name: Náhled odkazu patří k vlastní stránce
        run: node scripts/test-sdileni.mjs

      - name: Rozesílač upozornění e-mailem
        run: node scripts/test-rozesilac.mjs

      - name: Cizí servery proti zásadám soukromí
        run: node scripts/test-cizi-servery.mjs

      - name: Očištěný stylopis odpovídá zdroji
        run: node scripts/test-minifikace.mjs

      - name: Řezy dat dávají dohromady celek
        run: node scripts/test-data-rezy.mjs

      - name: Vstup cenového modelu (malý soubor dá totéž co velký)
        run: node scripts/test-model-vstup.mjs

      - name: Jeden styl (nadpisy a textura z palety)
        run: node scripts/test-jeden-styl.mjs

      - name: Sliby o datech odpovídají tomu, co web dělá
        run: node scripts/test-sliby-data.mjs

      - name: Konec nabídky není konec adresy
        run: node scripts/test-ukonceno.mjs

      - name: Cesta ven z okresu
        run: node scripts/test-cesta-ven.mjs

      - name: Rychlý výběr (logika balíčku)
        run: node scripts/test-rychlovyber.mjs

      - name: Čtvrť u nabídek, kde je místo jen celá obec
        run: node scripts/test-ctvrt.mjs

      - name: Cenový model (odhad obvyklé ceny)
        run: node scripts/test-ceny.mjs

      - name: Návratnost koupě pozemku
        run: node scripts/test-navratnost.mjs

      - name: Rádce u pozemku (rady podle skutečných údajů)
        run: node scripts/test-radce.mjs

      - name: Integrita datového souboru
        run: node scripts/test-data.mjs

      - name: Čeština ve viditelném textu
        run: node scripts/test-cestina.mjs

      - name: Podřezaná písma pokrývají, co web ukazuje
        run: node scripts/test-pisma.mjs

      - name: Poloha vs okres (patří k sobě?)
        run: node scripts/test-okres-poloha.mjs

      - name: Vlastní stránka pro každý pozemek
        run: node scripts/test-stranky-pozemku.mjs


      - name: Šifrování push zpráv (proti vzorku referenční implementace)
        run: node scripts/test-web-push.mjs

      - name: Zařazení pozemku do okresu
        run: node scripts/test-okres.mjs

  # Všechno, co potřebuje opravdový prohlížeč: chat, mapa, hlavička,
  # kontrast, dotykové terče, výpadky… Běží zvlášť od rychlých testů, aby
  # se kvůli stahování Chromia nečekalo na každou drobnost. Kroky, které
  # prohlížeč potřebují, musí být V TOMHLE jobu — jinde se neinstaluje.
  v-prohlizeci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prohlížeč
        run: |
          npm install --no-audit --no-fund playwright-core playwright
          npx playwright install --with-deps chromium

      - name: Projít chat v prohlížeči
        run: node scripts/test-chat-prohlizec.mjs

      - name: Odhlášení z e-mailů a přepínač posílání
        run: node scripts/test-odhlaseni.mjs

      - name: Kontrola fotek (že běží a odkud se bere)
        run: node scripts/test-kontrola-fotek.mjs

      - name: Mobilní menu (jedno místo, funguje všude)
        run: node scripts/test-menu.mjs

      # Potřebuje prohlížeč (playwright-core). V rychlém jobu „testy" se
      # neinstaluje, takže tam krok padal na chybějícím balíčku — a s ním
      # celý běh. Patří sem, mezi ostatní testy v prohlížeči.
      - name: Přihlášení (web neodhlašuje sám od sebe)
        run: node scripts/test-prihlaseni.mjs

      - name: Vrstvení (co je nad čím)
        run: node scripts/test-vrstveni.mjs

      - name: Co má hidden, nesmí být vidět
        run: node scripts/test-skryte.mjs

      - name: Barevné odznaky jsou čitelné v obou režimech
        run: node scripts/test-odznaky.mjs

      - name: Kontrast textu (WCAG AA)
        run: node scripts/test-kontrast.mjs

      - name: Zaostření klávesnicí (vidí člověk, kde stojí)
        run: node scripts/test-zaostreni.mjs

      - name: Co se pod myší zvedne, na to musí jít kliknout
        run: node scripts/test-zdvih.mjs

      - name: Vazby ARIA vedou na prvky, které existují
        run: node scripts/test-aria-cile.mjs

      - name: Do posuvné oblasti se vejde aspoň jedna položka
        run: node scripts/test-vmacknuto.mjs

      - name: První dotek mapu jen probudí, nehýbe s ní
        run: node scripts/test-probuzeni.mjs

      - name: Tlačítko „nahoru" na dlouhých stránkách
        run: node scripts/test-nahoru.mjs

      - name: Kalkulačka nákladů při koupi
        run: node scripts/test-naklady.mjs


      - name: Kalkulačka hypotéky
        run: node scripts/test-hypoteka.mjs

      - name: Porovnání uložených pozemků
        run: node scripts/test-porovnani.mjs

      - name: Dotykové terče na mobilu
        run: node scripts/test-dotyk.mjs

      - name: Našeptávač obcí a oprava překlepu
        run: node scripts/test-naseptavac.mjs

      - name: Ovládání mapy (klepání do plátna)
        run: node scripts/test-mapa.mjs

      - name: Odznaky shluků na mapě (barva nesmí lhát)
        run: node scripts/test-shluky.mjs

      - name: Mapa s vrstvami v detailu pozemku
        run: node scripts/test-mapa-pozemku.mjs

      - name: Mapová knihovna se stahuje až na dohled
        run: node scripts/test-leaflet.mjs

      - name: Data stránky pozemku (dva malé soubory místo velkého)
        run: node scripts/test-data-stranky.mjs

      - name: Offline režim (service worker, bez signálu i bez cizích serverů)
        run: node scripts/test-offline.mjs

      - name: Cenová mapa okresů (mapa říká totéž jako seznam)
        run: node scripts/test-cenova-mapa.mjs

      - name: Mapa při tažení (rozhraní zmizí a vrátí se)
        run: node scripts/test-mapa-tazeni.mjs

      - name: Kreslení výběru na mapě (filtruje podle tvaru)
        run: node scripts/test-kresleni.mjs

      - name: Obarvení teček podle ceny (levnější je modřejší)
        run: node scripts/test-barva-ceny.mjs

      - name: Vrstvy úřadů na hlavní mapě (až na vyžádání)
        run: node scripts/test-vrstvy-mapa.mjs

      - name: Předvyplnění inzerátu z odkazu
        run: node scripts/test-predvyplneni.mjs

      - name: Shoda cen mezi mapou a stránkou pozemku
        run: node scripts/test-shoda.mjs

      - name: Čerstvost dat a stav zdrojů
        run: node scripts/test-cerstvost.mjs

      - name: Řazení výpisu (každá volba dělá, co slibuje)
        run: node scripts/test-razeni.mjs

      - name: Co se doporučuje a co se má ověřit
        run: node scripts/test-doporuceni.mjs

      - name: Hlídané místo a pozemky v okolí
        run: node scripts/test-okoli.mjs

      - name: Rozvržení na všech šířkách a popisky stránek
        run: node scripts/test-rozvrzeni.mjs

      - name: Pohyb (odezva mapy a měřítka, i s vypnutými animacemi)
        run: node scripts/test-pohyb.mjs

      - name: Barvy kategorií (jeden zdroj pro mapu i karty)
        run: node scripts/test-barvy.mjs

      - name: Mapový podklad (tlumený, ale ne vybělený)
        run: node scripts/test-podklad.mjs

      - name: Barva u verdiktu o ceně
        run: node scripts/test-verdikt.mjs

      - name: Ikony (jedna sada, jedna tloušťka)
        run: node scripts/test-ikony.mjs

      - name: Letecký snímek pozemku (měřítko a poctivost)
        run: node scripts/test-snimek.mjs

      - name: Lepivá hlavička (drží nahoře, menu se otevře)
        run: node scripts/test-hlavicka.mjs

      - name: Barva lišty prohlížeče (theme-color sedí s hlavičkou)
        run: node scripts/test-barva-listy.mjs

      - name: Prázdno pod obsahem a kotvy pod hlavičkou
        run: node scripts/test-prazdno.mjs

      - name: Patička (rozvržení na počítači i na telefonu)
        run: node scripts/test-paticka.mjs

      - name: Výpadek dat a mrtvé záznamy
        run: node scripts/test-vypadky.mjs

      - name: Chyby skriptů a přetékání na všech druzích stránek
        run: node scripts/test-konzole.mjs

      - name: Úvodní obrazovka (živá čísla, věrohodnost cen)
        run: node scripts/test-uvod.mjs

      - name: Druh příležitosti se pozná i bez barev
        run: node scripts/test-tvary.mjs

      - name: Obecní záměr — celá cesta od dat po detail
        run: node scripts/test-obec.mjs

      - name: Paměť prohlížeče (nové od minule, skryté, filtr)
        run: node scripts/test-pamet.mjs

      - name: Stabilita rozvržení při načítání (CLS)
        run: node scripts/test-stabilita.mjs

      - name: Jeden vizuální jazyk (velikosti písma, přechody)
        run: node scripts/test-jazyk.mjs

      - name: Viditelnost okrajů (WCAG 1.4.11)
        run: node scripts/test-okraje.mjs

      - name: Barvy po najetí myší
        run: node scripts/test-najeti.mjs

      - name: Odolnost proti vloženému kódu (XSS)
        run: node scripts/test-xss.mjs

      - name: JSON ve stránce (nejde rozbít cizím textem)
        run: node scripts/test-json-ve-strance.mjs

      - name: Obrys pozemku (nekreslíme, co nevíme)
        run: node scripts/test-obrys.mjs

      - name: Hierarchie tlačítek (co je tu hlavní?)
        run: node scripts/test-hierarchie.mjs

      - name: Rozbalovací seznam (myší i klávesou)
        run: node scripts/test-rozbalovac.mjs

      - name: Funkční kontrola stránek a odkazů
        run: node scripts/test-stranky.mjs

      - name: Hlídání v aplikaci (celá cesta)
        run: node scripts/test-hlidani-prohlizec.mjs

      - name: Sdílený odkaz na stav mapy (celá cesta)
        run: node scripts/test-odkaz-prohlizec.mjs

      - name: Stránkování seznamu nabídek
        run: node scripts/test-strany.mjs

      - name: Na ovládání je vidět, že je ovládání
        run: node scripts/test-afordance.mjs

      - name: Ztlumené okolí mapy
        run: node scripts/test-maska.mjs

      - name: Rychlý výběr v prohlížeči (celá cesta)
        run: node scripts/test-rychly-prohlizec.mjs

      - name: Přidání vlastního pozemku (celá cesta)
        run: node scripts/test-pridat.mjs

      - name: Sliby webu platí doopravdy
        run: node scripts/test-sliby.mjs

      - name: Okno „Vyberte své okolí"
        run: node scripts/test-vyber-okoli.mjs

      - name: Graf vývoje cenové hladiny
        run: node scripts/test-graf-cen.mjs

      - name: Podklad hlavní mapy
        run: node scripts/test-podklad-mapy.mjs


      - name: Tah ikon je jeden (1,5 px)
        run: node scripts/test-tahy.mjs

      - name: Lišta s cenou a akcí na detailu
        run: node scripts/test-lista.mjs

      - name: Souřadnice pozemku s sebou
        run: node scripts/test-souradnice.mjs

      - name: Soukromá poznámka k pozemku
        run: node scripts/test-poznamky.mjs

      - name: Parametry pozemku — tři čísla nahoře, popisek u hodnoty
        run: node scripts/test-parametry.mjs

      - name: Moje data — co si web pamatuje
        run: node scripts/test-ulozene.mjs

      - name: Značka „už otevřeno"
        run: node scripts/test-videno.mjs

      - name: Hlídání okruhu od místa
        run: node scripts/test-okruh-hlidani.mjs
