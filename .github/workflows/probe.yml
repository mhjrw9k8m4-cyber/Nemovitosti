name: Průzkum dražebních zdrojů (dočasné)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Průzkum zdrojů
        run: node scripts/probe-sources.mjs
