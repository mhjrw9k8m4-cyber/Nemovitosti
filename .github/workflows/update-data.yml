name: Aktualizace dat příležitostí

# Robot pravidelně stáhne data z veřejných zdrojů a uloží je do
# data/opportunities.json. Web si ten soubor při načtení přečte.
#
# Pozn.: naplánované spuštění (schedule) běží jen nad výchozí větví repozitáře.
# Aby se aktualizoval web, musí workflow běžet nad tou větví, ze které se
# publikuje GitHub Pages. Ručně lze spustit přes „Run workflow" (workflow_dispatch).

on:
  schedule:
    # 4× denně (každých 6 h) — zdroje se aktualizují v různou dobu (po půlnoci,
    # kolem poledne…), tak je chytáme vícekrát. Časy jsou v UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sreality:
        # RUČNÍ BĚH SREALITY NETAHÁ, DOKUD SE O TO NEŘEKNE. Dřív ho tahal
        # vždycky („aby se dalo měřit") a to bylo napsané v době, kdy se
        # nevědělo, kolik to stojí. Teď se to ví: $3 za tisíc výsledků,
        # tedy až $6 za jeden běh. Ruční spuštění kvůli jakékoli jiné
        # opravě dat by tu částku zaplatilo mimochodem.
        description: 'Zaplatit i běh Sreality přes Apify (~$6)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write          # zakládá úkol, když úloha selže (viz poslední krok)

jobs:
  update:
    runs-on: ubuntu-latest
    # Strop proti visícímu spojení, ne proti pomalosti: bez něj
    # GitHub úlohu zastaví až po šesti hodinách a další
    # naplánovaný běh se do té doby nespustí (robot stahuje a přepisuje 2 159 stránek).
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout data
        # SREALITY JEN V JEDNOM ZE ČTYŘ DENNÍCH BĚHŮ, a je to o peníze.
        # Rozhoduje se tady v shellu podle HODINY, ne ve výrazu nad `env`:
        # `github.event.schedule` vrací ten cron výraz, a ten je pro
        # všechny čtyři běhy týž ('0 */6 * * *'), takže by 6:00 od 12:00
        # neodlišil. Napsané to tak nejdřív bylo a tohle je oprava.
        #
        # A OD 6. 11. JEN V PONDĚLÍ, protože se změřilo, kolik to stojí:
        # první ostrý běh vrátil 1 666 záznamů a stál $4,998, tedy $3 za
        # tisíc výsledků. Denně by to při stropu 2 000 záznamů bylo až
        # $6 za den, tedy přes $180 za měsíc. Týdně je to do $26.
        # Jsou to majitelovy peníze, takže se začíná tím menším číslem;
        # zvednout frekvenci je jedna řádka (`-u +%u` je den v týdnu,
        # 1 = pondělí) a patří to k rozhodnutí, ne k mlčení.
        run: |
          set -euo pipefail
          if [ "${SREALITY_RUCNE:-}" = "true" ] \
             || { [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] \
                  && [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "06" ]; }; then
            export APIFY_TOKEN="${APIFY_TOKEN_TAJNY:-}"
            echo "Sreality: tahá se (vyžádané ruční spuštění nebo pondělní běh po 6. hodině UTC)."
          else
            echo "Sreality: vynechává se, token se v tomhle běhu nepředává" \
              "(den $(date -u +%u), hodina $(date -u +%H) UTC, ručně='${SREALITY_RUCNE:-ne}')."
          fi
          node scripts/fetch-opportunities.mjs
        env:
          # Volitelné: když je nastaven tajný klíč APIFY_TOKEN, přidá se zdroj
          # Sreality (přes Apify). Bez klíče se Sreality přeskočí (žádná chyba).
          #
          # Robot jede každých 6 hodin (0, 6, 12, 18 UTC) a běh přes Apify
          # trvá až pět minut a spotřebuje kredit, který se platí. Kdyby se
          # token předal pokaždé, byly by to 4 platby denně a 120 za měsíc —
          # za data, která se mezi dvěma šestihodinovými běhy skoro nezmění:
          # pozemek se neprodá za šest hodin. Ruční spuštění tahá Sreality
          # vždy, aby se dalo měřit.
          # Pod jiným jménem schválně: krok výš ho do APIFY_TOKEN přepíše
          # jen v tom jednom běhu. Čtečka bez APIFY_TOKEN Sreality vynechá
          # a napíše to do logu — stav, který umí (není to chyba).
          SREALITY_RUCNE: ${{ inputs.sreality }}
          APIFY_TOKEN_TAJNY: ${{ secrets.APIFY_TOKEN }}
          APIFY_SREALITY_ACTOR: ${{ secrets.APIFY_SREALITY_ACTOR }}

      # ARCHIV. Musí běžet HNED po stažení a PŘED přegenerováním webu:
      # porovnává nová data s tím, co si pamatuje z minula. Kdyby běžel
      # později, nic se nezkazí — ale kdyby neběžel vůbec, zmizelé
      # nabídky se ztratí a zpětně se dopočítat dají jen z historie
      # gitu, tedy dokud ji někdo nepřepíše.
      - name: Archiv nabídek (co zmizelo a co zlevnilo)
        run: node scripts/archiv.mjs

      # Nejen přegenerovat stránky, ale spravit všechno odvozené: stránky
      # krajů a okresů, čísla v úvodu, dražby, rozcestník, sitemap, razítka
      # ?v= u skriptů i sloučené SQL. Robot tím strom čtyřikrát denně srovná
      # se zdrojem — když někdo zapomene po zásahu do js/ přerazítkovat,
      # spraví se to samo do šesti hodin místo aby zůstala červená kontrola.
      # Každý krok je přepočet ze zdroje, nic se neodhaduje.
      # Časová řada cenových hladin. Bere jeden bod na den z historie
      # repozitáře a dnešek z právě staženého souboru, takže roste sama
      # a nepotřebuje žádnou databázi. Běží PŘED oprav.mjs, ať se nový
      # soubor stihne zarazítkovat spolu s ostatními.
      # Mělký klon jí nevadí: staré dny si opíše z data/historie-cen.json
      # a přidá dnešek. Přestavba od začátku se na mělkém klonu sama
      # zastaví, aby o historii nepřišla.
      - name: Dopsat dnešek do časové řady cen
        run: node scripts/historie-cen.mjs

      - name: Spravit vše odvozené (stránky, čísla v úvodu, sitemap, razítka, SQL)
        run: node scripts/oprav.mjs

      # ZAŘAZUJE SE VŠECHNO (co: -A), ne ručně psaný seznam souborů. Ten
      # seznam tu byl a zastaral: generátor dopisuje čísla i do index.html
      # (počet pozemků v úvodu a počty po krajích), jenže index.html
      # v seznamu nebyl. Robot tedy čtyřikrát denně čísla přepočítal a tu
      # změnu zahodil, takže úvodní stránka zůstala viset na posledním
      # ručním commitu, zatímco data šla dál. „-A" je tu bezpečné: jediné
      # kroky téhle úlohy jsou stažení dat a generátor, takže co je ve
      # stromu změněné, udělaly ony; klíče hlídá .gitignore. A zahrne to
      # i stránky, které generátor smazal (zaniklé okresy).
      - name: Commit změn (jen pokud se něco změnilo)
        uses: ./.github/actions/commit-a-push
        with:
          zprava: "data: automatická aktualizace příležitostí + regionální stránky"

      # KDYŽ TO SPADNE, AŤ SE TO NĚKDO DOZVÍ. Bez tohohle kroku zůstane
      # po selhané noční úloze červená tečka v záložce Actions, kam se
      # nikdo nedívá. Zakládá jeden úkol na úlohu a další selhání k němu
      # jen připíše; sám nikdy nespadne, aby nepřebil tu první chybu.
      # HLÍDKA AŽ TADY, ZA COMMITEM. Kdyby na tiše rozbitý zdroj skončil
      # chybou krok „Stáhnout data", GitHub přeskočí všechno za ním —
      # tedy i commit. Den, kdy se zdroj pokazí, by byl i dnem, kdy se
      # zahodí všechno, co se stáhnout PODAŘILO, a kdy se nezapíše ani
      # počítadlo, podle kterého se příště pozná, že je to už potřetí.
      # Data jsou v téhle chvíli uložená; hlídka jen rozhodne o barvě
      # běhu, a červená pak založí úkol krokem níž.
      - name: Hlídka zdrojů (zdroj mimo pořádek 3× v řadě)
        run: node scripts/hlidka-zdroju.mjs

      - name: Ohlásit selhání
        if: failure()
        uses: ./.github/actions/ohlas-selhani
        with:
          jmeno: Robot dat (stahování nabídek)
          co-to-znamena: >-
            Nabídky se přestaly obnovovat. Web dál ukazuje poslední stará data a nové pozemky nikomu nepřijdou.
