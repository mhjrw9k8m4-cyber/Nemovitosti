name: Aktualizace dat příležitostí

# Robot pravidelně stáhne data z veřejných zdrojů a uloží je do
# data/opportunities.json. Web si ten soubor při načtení přečte.
#
# Pozn.: naplánované spuštění (schedule) běží jen nad výchozí větví repozitáře.
# Aby se aktualizoval web, musí workflow běžet nad tou větví, ze které se
# publikuje GitHub Pages. Ručně lze spustit přes „Run workflow" (workflow_dispatch).

on:
  schedule:
    # 4× denně (každých 6 h) — zdroje se aktualizují v různou dobu (po půlnoci,
    # kolem poledne…), tak je chytáme vícekrát. Časy jsou v UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout data
        run: node scripts/fetch-opportunities.mjs
        env:
          # Volitelné: když je nastaven tajný klíč APIFY_TOKEN, přidá se zdroj
          # Sreality (přes Apify). Bez klíče se Sreality přeskočí (žádná chyba).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_SREALITY_ACTOR: ${{ secrets.APIFY_SREALITY_ACTOR }}

      - name: Přegenerovat regionální stránky (kraje, okresy, dražby, rozcestník + sitemap)
        run: node scripts/generate-region-pages.mjs

      - name: Commit změn (jen pokud se něco změnilo)
        run: |
          git add data/opportunities.json data/geocode-cache.json sitemap.xml pozemky-podle-okresu.html drazby-pozemku-nabidky.html pozemky-okres-*.html pozemky-*-kraj.html
          # Odstraněné (sirotčí) stránky, které generátor smazal, ať zmizí i z repozitáře:
          git add -A -- 'pozemky-okres-*.html' 'pozemky-*-kraj.html'
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "pozemkomat-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: automatická aktualizace příležitostí + regionální stránky"
            git push
          else
            echo "Beze změny."
          fi

      # Upozornění na lokalitu (e-mailem). Bezpečné: bez SUPABASE_SERVICE_ROLE_KEY
      # tiše skončí (nic neposílá), a i s klíči je to DRY-RUN, dokud nenastavíš
      # ALERTS_LIVE=1. Nikdy neblokuje aktualizaci dat (continue-on-error).
      - name: Rozeslat upozornění na lokalitu
        continue-on-error: true
        run: node scripts/send-alerts.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ALERTS_LIVE: ${{ secrets.ALERTS_LIVE }}
