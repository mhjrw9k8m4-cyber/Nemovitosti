name: Aktualizace dat příležitostí

# Robot pravidelně stáhne data z veřejných zdrojů a uloží je do
# data/opportunities.json. Web si ten soubor při načtení přečte.
#
# Pozn.: naplánované spuštění (schedule) běží jen nad výchozí větví repozitáře.
# Aby se aktualizoval web, musí workflow běžet nad tou větví, ze které se
# publikuje GitHub Pages. Ručně lze spustit přes „Run workflow" (workflow_dispatch).

on:
  schedule:
    - cron: '0 4 * * *'   # každý den ve 4:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout data
        run: node scripts/fetch-opportunities.mjs

      - name: Commit změn (jen pokud se data změnila)
        run: |
          if [[ -n "$(git status --porcelain data/opportunities.json data/geocode-cache.json)" ]]; then
            git config user.name "pozemkomat-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/opportunities.json data/geocode-cache.json
            git commit -m "data: automatická aktualizace příležitostí"
            git push
          else
            echo "Data beze změny."
          fi
