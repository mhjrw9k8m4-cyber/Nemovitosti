name: Aktualizace dat příležitostí

# Robot pravidelně stáhne data z veřejných zdrojů a uloží je do
# data/opportunities.json. Web si ten soubor při načtení přečte.
#
# Pozn.: naplánované spuštění (schedule) běží jen nad výchozí větví repozitáře.
# Aby se aktualizoval web, musí workflow běžet nad tou větví, ze které se
# publikuje GitHub Pages. Ručně lze spustit přes „Run workflow" (workflow_dispatch).

on:
  schedule:
    # 4× denně (každých 6 h) — zdroje se aktualizují v různou dobu (po půlnoci,
    # kolem poledne…), tak je chytáme vícekrát. Časy jsou v UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout data
        run: node scripts/fetch-opportunities.mjs
        env:
          # Volitelné: když je nastaven tajný klíč APIFY_TOKEN, přidá se zdroj
          # Sreality (přes Apify). Bez klíče se Sreality přeskočí (žádná chyba).
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_SREALITY_ACTOR: ${{ secrets.APIFY_SREALITY_ACTOR }}

      # Nejen přegenerovat stránky, ale spravit všechno odvozené: stránky
      # krajů a okresů, čísla v úvodu, dražby, rozcestník, sitemap, razítka
      # ?v= u skriptů i sloučené SQL. Robot tím strom čtyřikrát denně srovná
      # se zdrojem — když někdo zapomene po zásahu do js/ přerazítkovat,
      # spraví se to samo do šesti hodin místo aby zůstala červená kontrola.
      # Každý krok je přepočet ze zdroje, nic se neodhaduje.
      - name: Spravit vše odvozené (stránky, čísla v úvodu, sitemap, razítka, SQL)
        run: node scripts/oprav.mjs

      - name: Commit změn (jen pokud se něco změnilo)
        run: |
          # Zařadí se VŠECHNO, co po sobě oba kroky nechaly — ne ručně psaný
          # seznam souborů. Ten seznam tu totiž byl a zastaral: generátor
          # dopisuje čísla i do index.html (počet pozemků v úvodu a počty po
          # krajích), jenže index.html v seznamu nebyl. Robot tedy čtyřikrát
          # denně čísla přepočítal a tu změnu zahodil, takže úvodní stránka
          # zůstala viset na posledním ručním commitu, zatímco data šla dál.
          #
          # „git add -A" je tu bezpečné: jediné kroky téhle úlohy jsou
          # stažení dat a generátor, takže co je ve stromu změněné, udělaly
          # ony. Klíče a závislosti hlídá .gitignore. Zároveň to zahrne
          # i stránky, které generátor smazal (zaniklé okresy).
          git add -A
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "parcelka-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: automatická aktualizace příležitostí + regionální stránky"
            git push
          else
            echo "Beze změny."
          fi
