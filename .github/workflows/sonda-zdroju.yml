name: Sonda zdrojů

# Měří, které zdroje nabídek jde vůbec číst — a tím připravuje odpověď
# na jedinou vážnou slabinu dat: změřeno 2. 11. 2026, že čtyři pětiny
# nabídek na webu nese jediný zdroj. Sonda nic nepublikuje a do nabídek
# nezasahuje; jen u každého zdroje a kandidáta zjistí, co dovoluje jeho
# robots.txt, jestli adresa odpovídá a jestli na ní vůbec jsou pozemky,
# a zapíše nález do data/zdroje-sonda.json.
#
# JEDNOU TÝDNĚ, NE ČTYŘIKRÁT DENNĚ. Je to měření pro rozhodování, ne
# zdroj dat pro web. Na jeden zdroj jdou nejvýš dva dotazy za běh.

on:
  schedule:
    # Pondělí ve 4:37 UTC — mimo špičku a mimo čas robota dat (ten běží
    # v 0, 6, 12 a 18), ať si dvě úlohy nelezou do commitů.
    - cron: '37 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write          # zakládá úkol, když úloha selže

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PROHLÍŽEČ, protože „skořápka" není verdikt o zdroji, ale o tom,
      # čím ho čteme (§353). Naměřeno u ÚZSVM: 0 m², 0× „pozemek" i po
      # třech dalších adresách a po sitemap. Sonda ho pouští JEN
      # u skořápky a jen na měřenou adresu; robots.txt platí i pro
      # podřízené soubory. Verze je připnutá, ať je zvednutí vidět.
      - name: Prohlížeč
        run: |
          npm install --no-audit --no-fund --ignore-scripts playwright-core@1.64.1 playwright@1.64.1
          npx playwright install --with-deps chromium
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)"

      - name: Změřit zdroje
        run: node scripts/sonda-zdroju.mjs

      - name: Commit nálezu (jen pokud se něco změnilo)
        uses: ./.github/actions/commit-a-push
        with:
          zprava: "data: nález sondy zdrojů"
          co: data/zdroje-sonda.json
      # ÚSPĚCH, KTERÝ NA NĚKOHO ČEKÁ, SE TAKY MUSÍ OHLÁSIT — měřeno
      # 5. 11.: v nálezu leželo pět dostupných a slibných kandidátů,
      # kteří nejsou zapojení, a nedozvěděl se o nich nikdo (§431).
      - name: Ohlásit nález
        if: success()
        uses: ./.github/actions/ohlas-nalez
        with:
          nalez: data/zdroje-sonda.json
          pole: noveKandidaty
          znacka: sonda-zdroju
          nazev: Sonda zdrojů
      - name: Ohlásit selhání
        if: failure()
        uses: ./.github/actions/ohlas-selhani
        with:
          jmeno: Sonda zdrojů
          co-to-znamena: >-
            Neměří se, které zdroje nabídek jde číst. Web tím hned netrpí, ale závislost na jednom zdroji se přestane sledovat.
