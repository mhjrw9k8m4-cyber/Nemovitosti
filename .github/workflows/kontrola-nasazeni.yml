name: Kontrola nasazeného webu

# Celý ostatní řetěz hlídačů kontroluje REPOZITÁŘ. Nasazení ale dělá
# GitHub Pages a nikdo nekontroloval, co je doopravdy VENKU — zelená CI
# a den starý web vedle sebe obstojí.
#
# Běží 35 minut po robotovi (ten jede v 0 */6), tedy ve chvíli, kdy už
# mají být nová data nasazená. Co se měří, je v scripts/kontrola-nasazeni.mjs,
# scripts/kontrola-spusteni.mjs a scripts/kontrola-ziva-prohlizecem.mjs.
#
# Ty tři se ptají jinak a jedna druhou nenahradí: první přes HTTP (je
# venku ta verze?), druhá do databáze (odpovídá?), třetí OTEVŘE WEB
# V PROHLÍŽEČI — protože všech devět kontrol první z nich projde i na
# webu, kde se skript při načtení zhroutí a člověk vidí prázdno.

on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
    inputs:
      # CVIČENÍ OPRAVNÉHO KROKU, jen pro ruční běh. Opravný krok níž se
      # při běžném běhu nikdy nespustí (data venku jsou svěží), takže
      # jediná věc, kterou falešné API dokázat nemůže, zůstávala
      # neprokázaná: že GITHUB_TOKEN s actions: write robota opravdu
      # vyvolá. Tímhle vstupem se strop na stáří dat posune tak nízko,
      # že kontrola nález „stará data" vyrobí — a opravný krok se
      # provede naostro. Robot dat jede čtyřikrát denně, takže jeho
      # jedno spuštění navíc nic nerozbije.
      strop-stare-hodin:
        description: 'Cvičení opravy: strop na stáří dat v hodinách (prázdné = běžný běh)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write          # zakládá úkol, když je venku něco jiného (poslední krok)
  actions: write         # jen aby šlo vyvolat robota dat, viz scripts/sebeoprava-nasazeni.mjs

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # z toho většinu spolkne instalace prohlížeče
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tahle úloha nikam nepushuje, takže si token z checkoutu
          # nenechává na disku. Hlídá to scripts/test-ci-prava.mjs.
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Razítka ?v= se porovnávají s místním index.html, takže
      # závislosti ani build nejsou potřeba — stačí repozitář.
      # NEJDŘÍV: BĚŽÍ VŮBEC JEŠTĚ TI HLÍDAČI? Všechny plánované úlohy
      # mají jednu tichou vadu, kterou žádná z nich sama nepozná —
      # GitHub plán po 60 dnech bez aktivity sám vypne, a od té chvíle
      # je všechno zelené, protože se nic neměří. Tahle kontrola se
      # sama ověřit nemůže, proto běží i v Cvičení sebeopravy: dvě
      # úlohy s různou periodou se kryjí navzájem.
      - name: Běží ještě ti hlídači (plánované úlohy)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/kontrola-uloh.mjs

      # `--vystup` je strojově čitelný seznam nálezů (kódy). Čte ho
      # sebeoprava v předposledním kroku; text výpisu je pro člověka.
      - name: Zkontrolovat, co je venku
        env:
          PK_DATA_STARE_HODIN: ${{ inputs.strop-stare-hodin }}
        run: node scripts/kontrola-nasazeni.mjs --vystup nalezy.json

      # Web stojí na Supabase, a ten se taky může rozejít s tím, co web
      # čeká: funkce zmizí (když se pustí starší SQL), pravidlo se
      # uvolní, klíč se vymění, projekt se uspí. Nic z toho statické
      # soubory venku nepoznají. Čtou se jen veřejným klíčem a nic se
      # nezapisuje; co se pozná z repozitáře, se v tomhle režimu
      # schválně nehlásí (to už hlídá CI při každém pushi).
      # `if: always()` u všech měření: bez něj první nález zakryje
      # VŠECHNA ostatní měření (GitHub další kroky přeskočí), takže by
      # se o rozbité databázi nebo o mrtvém webu v prohlížeči nedozvěděl
      # nikdo, dokud se nespraví to první. Krok pořád padá, jen už
      # nemlčí za ostatní.
      - name: Zkontrolovat živou databázi
        if: always()
        run: node scripts/kontrola-spusteni.mjs --jen-zive

      # Až sem se web nikdy neotevřel v prohlížeči. Tenhle krok je
      # jediný, který měří, CO OPRAVDU UVIDÍ ČLOVĚK: výjimky ze
      # skriptů, zablokovanou CSP, nedotažené soubory, prázdný výpis,
      # nepostavenou mapu, přetečení na telefonu. Stojí za to i cena
      # instalace prohlížeče — mrtvý web se jinak nepozná vůbec.
      - name: Prohlížeč
        if: always()
        run: |
          # Připnutá verze, stejně jako ve zkouškách: ať se CI nerozsvítí
          # tím, co se v tu minutu vydalo na npm.
          npm install --no-audit --no-fund --ignore-scripts playwright-core@1.64.1 playwright@1.64.1
          npx playwright install --with-deps chromium
          node -e "console.log('playwright-core', require('playwright-core/package.json').version)"

      - name: Otevřít živý web v prohlížeči
        if: always()
        run: node scripts/kontrola-ziva-prohlizecem.mjs

      # HLÁŠENÍ NENÍ OPRAVA. Ze všech nálezů je jediný, u kterého se dá
      # z repozitáře něco UDĚLAT: stará data venku — robota dat jde
      # vyvolat (`update-data.yml` má `workflow_dispatch`). Kdy se jedná
      # a kdy ne, rozhoduje tabulka v scripts/sebeoprava-nasazeni.mjs;
      # mezi „nejednat" patří i případ, kdy robot právě dojel a data jsou
      # PŘESTO stará — to je vada nasazení, ne robota.
      - name: Sebeoprava — stará data venku pustí robota
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sebeoprava-nasazeni.mjs --nalezy nalezy.json --opravdu

      # PŘI CVIČENÍ OPRAVY REPORTÉR MLČÍ. Nález „stará data" je v tom
      # běhu VYROBENÝ, takže úkol pro člověka by lhal — a hlásič, který
      # jednou zalže, se přestane čítat. Při běžném běhu (schedule i
      # ruční bez vstupu) se hlásí jako dřív.
      - name: Ohlásit selhání
        if: failure() && inputs.strop-stare-hodin == ''
        uses: ./.github/actions/ohlas-selhani
        with:
          jmeno: Kontrola nasazeného webu
          co-to-znamena: >-
            Živý systém se rozešel s tím, co web čeká — na ostré doméně není ta verze, co je v repozitáři, jsou venku stará data, neodpovídá databáze, nebo se web v prohlížeči vůbec nesestaví (spadlý skript, zablokovaná CSP, prázdný výpis). Podrobnosti (včetně obou razítek a hlášky z prohlížeče) jsou ve výpisu úlohy.
