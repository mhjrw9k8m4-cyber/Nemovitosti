name: Stáhnout AI model na kontrolu fotek

# Stáhne model NSFWJS (MobileNetV2) do assets/nsfw-model/, ověří, že se dá
# načíst a klasifikovat, a commitne ho do větve. Web ho pak používá přímo
# (kontrola fotek běží v prohlížeči nahrávajícího, zdarma). Ruční spuštění.

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/web-design-sketch-ewjjrr

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout soubory modelu
        run: |
          set -e
          BASE=https://raw.githubusercontent.com/infinitered/nsfwjs/master/models/mobilenet_v2
          mkdir -p assets/nsfw-model
          echo "Stahuji model.json…"
          curl -fsSL "$BASE/model.json" -o assets/nsfw-model/model.json
          echo "Vytahuji názvy vah (shardy) z model.json…"
          node -e "const m=require('./assets/nsfw-model/model.json');const p=[].concat.apply([],(m.weightsManifest||[]).map(function(w){return w.paths;}));console.log(p.join('\n'));" > /tmp/paths.txt
          echo "Shardy:"; cat /tmp/paths.txt; echo
          # `|| [ -n "$f" ]` ošetří i poslední řádek bez ukončovacího \n
          while IFS= read -r f || [ -n "$f" ]; do
            [ -z "$f" ] && continue
            echo "Stahuji $f…"
            curl -fsSL "$BASE/$f" -o "assets/nsfw-model/$f"
          done < /tmp/paths.txt
          echo "Staženo:"; ls -la assets/nsfw-model
          echo "Obsah assets/nsfw-model:"; ls -la assets/nsfw-model

      - name: Ověřit kompletnost modelu (platný model.json + všechny shardy)
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const dir = "assets/nsfw-model/";
            const m = JSON.parse(fs.readFileSync(dir + "model.json", "utf8"));
            if (!m.modelTopology) { console.error("chybí modelTopology"); process.exit(1); }
            const paths = [].concat.apply([], (m.weightsManifest || []).map(function (w) { return w.paths; }));
            if (!paths.length) { console.error("žádné váhy v manifestu"); process.exit(1); }
            let total = 0;
            for (const p of paths) {
              const st = fs.statSync(dir + p);          // hodí chybu, když soubor chybí
              if (!st.size) { console.error("prázdný shard: " + p); process.exit(1); }
              total += st.size;
            }
            console.log("MODEL OK — " + paths.length + " shard(ů), " + (total/1048576).toFixed(1) + " MB vah, vstup 224px");
          '
          # Bezpečnostní stropy: model.json rozumně malý, celková velikost do 20 MB
          test "$(stat -c%s assets/nsfw-model/model.json)" -lt 5000000
          test "$(du -sb assets/nsfw-model | cut -f1)" -lt 20971520
          echo "Ověřeno."

      - name: Ověřit načtení v prohlížeči (jako u lidí)
        run: |
          set -e
          npm i --no-audit --no-fund playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > __nsfwtest.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.2/dist/nsfwjs.min.js"></script>
          <script>
          window.run = async function () {
            var model = await nsfwjs.load('/assets/nsfw-model/', { size: 224 });
            var cv = document.createElement('canvas'); cv.width = 224; cv.height = 224;
            var ctx = cv.getContext('2d'); ctx.fillStyle = '#3a7d3a'; ctx.fillRect(0, 0, 224, 224);
            return await model.classify(cv);
          };
          </script>
          HTML
          python3 -m http.server 8099 >/dev/null 2>&1 &
          sleep 1
          cat > __nsfwtest.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ args: ['--no-sandbox'] });
          const p = await b.newPage();
          p.on('console', m => console.log('  [browser]', m.text()));
          await p.goto('http://127.0.0.1:8099/__nsfwtest.html', { waitUntil: 'load', timeout: 60000 });
          let preds;
          try { preds = await p.evaluate(() => window.run()); }
          catch (e) { console.error('BROWSER LOAD FAIL:', e && e.message); await b.close(); process.exit(1); }
          console.log('Klasifikace zeleného obrázku:', JSON.stringify(preds));
          await b.close();
          if (!Array.isArray(preds) || preds.length !== 5) { console.error('Nečekaný počet tříd'); process.exit(1); }
          const m = {}; preds.forEach(x => m[x.className] = x.probability);
          if ((m.Porn || 0) + (m.Hentai || 0) >= 0.6) { console.error('Falešný poplach na neutrálním obrázku'); process.exit(1); }
          console.log('BROWSER OK — model se načte a klasifikuje, neutrální obrázek propuštěn.');
          JS
          node __nsfwtest.mjs
          rm -f __nsfwtest.html __nsfwtest.mjs package.json package-lock.json
          rm -rf node_modules

      - name: Commitnout model do větve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/nsfw-model
          if git diff --cached --quiet; then
            echo "Model už je v repu beze změny — nic k commitu."
          else
            git commit -m "AI model pro kontrolu fotek (NSFWJS MobileNetV2, self-hosted)"
            git push origin claude/web-design-sketch-ewjjrr
          fi
