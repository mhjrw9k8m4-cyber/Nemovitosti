name: Hranice krajů a okresů (jednorázově)

# Stáhne hranice 14 krajů (data/kraje.json) a 77 okresů
# (data/okresy-hranice.json). Stačí spustit jednou — hranice se nemění.
# Ruční spuštění přes „Run workflow".
#
# Hranice okresů nejsou ozdoba: bez nich si robot okres jen hádá podle
# nejbližšího okresního města a u obcí blízko hranice to mine.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  kraje:
    runs-on: ubuntu-latest
    # Strop proti visícímu spojení, ne proti pomalosti: bez něj
    # GitHub úlohu zastaví až po šesti hodinách a další
    # naplánovaný běh se do té doby nespustí (jeden soubor s hranicemi).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stáhnout hranice krajů
        run: node scripts/fetch-kraje.mjs

      - name: Stáhnout hranice okresů
        run: node scripts/fetch-okresy.mjs

      - name: Commit
        uses: ./.github/actions/commit-a-push
        with:
          zprava: "data: hranice krajů a okresů"
          co: data/kraje.json data/okresy-hranice.json