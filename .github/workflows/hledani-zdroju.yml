name: Hledání zdrojů

# Hledá nové zdroje pozemků tam, kde rejstřík vede někdo jiný a roste
# sám: v lokálních katalogech otevřených dat. Obce, města a úřady je
# povinně registrují na data.gov.cz; v každém z nich jsou datové sady
# a mezi nimi může být „Prodej pozemků" od úřadu, o kterém se jinak
# nikde nedočtu.
#
# NIC NEPUBLIKUJE A DO NABÍDEK NEZASAHUJE. Výsledek je seznam
# kandidátů v data/nalezene-zdroje.json; co s ním, rozhoduje měření
# sondou (robots, výtěžnost) a potom člověk.
#
# JEDNOU ZA MĚSÍC, NE TÝDNĚ — A TO ČÍSLO JE Z MĚŘENÍ (§461).
# Rejstřík má dnes 66 katalogů a běh z nich čte datové sady, takže
# to jsou stovky dotazů na cizí weby. Mezi každými dvěma je pauza
# a robots.txt se čte u KAŽDÉHO hostitele zvlášť — zákaz zastaví
# čtení, neobchází se.
#
# Dva běhy (4. a 6. 11.) přečetly 34 katalogů a 1 245 datových sad
# a našly NULU. A není to náhoda: dvacet sad, které byly nejblíž,
# jsou mapové a statistické sady ČÚZK a ČSÚ — RÚIAN, katastrální
# mapy, INSPIRE témata, indexy cen. Body si vysloužily slovy
# „parcela" a „pozemek" v popisu něčeho úplně jiného a podmínka
# „musí tam být slovo o převodu" je odmítla správně.
#
# Obce nabídky prodeje pozemků do katalogů otevřených dat
# nepublikují — dávají je na úřední desku. Týdenní běh by tedy byly
# stovky dotazů na cizí weby za nulový výtěžek, a to je vůči nim
# nezdvořilé. Měsíčně se zachytí, že se zaregistroval nový katalog,
# a víc tahle studna nenabízí.

on:
  schedule:
    # První den v měsíci ve 5:23 UTC — po sondě zdrojů (4:37) a mimo
    # čas robota dat (0, 6, 12, 18), ať si úlohy nelezou do commitů.
    - cron: '23 5 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write          # zakládá úkol, když úloha selže

jobs:
  hledani:
    runs-on: ubuntu-latest
    # Rozpočet běhu je 1 800 sad a změřeno 4. 11. (41810908514) zabere
    # jedna sada asi sekundu včetně pauzy — tedy ~30 minut. Hodina je
    # rezerva, ne plán.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Projít rejstřík katalogů
        run: node scripts/hledej-zdroje.mjs --zapis

      - name: Commit nálezu (jen pokud se něco změnilo)
        uses: ./.github/actions/commit-a-push
        with:
          zprava: "data: nález hledání zdrojů"
          co: data/nalezene-zdroje.json
      # ÚSPĚCH, KTERÝ NA NĚKOHO ČEKÁ, SE TAKY MUSÍ OHLÁSIT. Třetí
      # hledač k témuž hlásiči — §431 to slibovalo, §435 to dodělalo.
      - name: Ohlásit nález
        if: success()
        uses: ./.github/actions/ohlas-nalez
        with:
          nalez: data/nalezene-zdroje.json
          pole: noveKandidaty
          znacka: hledani-zdroju
          nazev: Hledání zdrojů
      - name: Ohlásit selhání
        if: failure()
        uses: ./.github/actions/ohlas-selhani
        with:
          jmeno: Hledání zdrojů
          co-to-znamena: >-
            Nehledají se nové zdroje pozemků. Web tím hned netrpí, ale závislost na hrstce dnešních zdrojů se přestane snižovat.
