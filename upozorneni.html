<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>Hlídání lokality — Parcelka</title>
  <meta name="description" content="Potvrzení a odhlášení hlídání lokality na Parcelce.">
  <meta name="theme-color" content="#EDEFF4">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tcinuzftgmkvjjgvadky.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260824a">
  <style>
    #obsah{background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
    .up-card{max-width:460px; width:100%; text-align:center; background:var(--ink-soft); border:1px solid var(--line);
      border-radius:18px; padding:34px 26px; color:var(--text-ondark); box-shadow:0 20px 44px -22px rgba(0,0,0,.7);}
    .up-logo{font-size:22px; font-weight:800; color:var(--copper-bright); margin-bottom:18px;}
    .up-ic{width:58px; height:58px; margin:0 auto 16px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--ink-soft2);}
    .up-ic svg{width:30px; height:30px;}
    .up-card h1{font-size:21px; font-weight:700; margin-bottom:10px; line-height:1.25;}
    .up-card p{font-size:15px; color:var(--text-ondark-mute); line-height:1.55;}
    .up-card .btn-primary{margin-top:22px; display:inline-block;}
    .ok{color:var(--c-sale);} .bad{color:var(--c-exekuce);}
  </style>
</head>
<body>
<main id="obsah">
  <div class="up-card">
    <div class="up-logo">Parcelka</div>
    <div class="up-ic" id="up-ic" aria-hidden="true"></div>
    <h1 id="up-title">Zpracovávám…</h1>
    <p id="up-text">Chvíli strpení.</p>
    <a class="btn-primary" href="index.html">Zpět na mapu</a>
  </div>
</main>
<script src="js/config.js?v=20260824a"></script>
<script>
(function () {
  var URL_ = (window.PK_SUPABASE_URL || ''), KEY = (window.PK_SUPABASE_KEY || '');
  var q = location.search;
  function param(n) { var m = new RegExp('[?&]' + n + '=([^&]+)').exec(q); try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return m ? m[1] : ''; } }
  var confirmTok = param('confirm'), unsubTok = param('unsubscribe');
  var icon = document.getElementById('up-ic'), title = document.getElementById('up-title'), text = document.getElementById('up-text');
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#4FB487" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="#6E9BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
  var X = '<svg viewBox="0 0 24 24" fill="none" stroke="#DE7259" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  function show(ic, t, tx, cls) { icon.innerHTML = ic; title.innerHTML = t; title.className = cls || ''; text.innerHTML = tx; }

  function rpc(fn, args) {
    return fetch(URL_ + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args || {})
    }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  if (!URL_ || !KEY) { show(X, 'Něco se nepovedlo', 'Zkuste to prosím později.', 'bad'); return; }

  if (confirmTok) {
    rpc('confirm_watch', { p_token: confirmTok }).then(function (res) {
      if (res === true) show(CHECK, 'Hotovo — hlídání potvrzeno', 'Od teď vám dáme vědět e-mailem, jakmile se objeví nová příležitost. Kdykoli se můžete odhlásit odkazem v e-mailu.', 'ok');
      else show(BELL, 'Odkaz už neplatí', 'Buď je hlídání už potvrzené, nebo odkaz vypršel. Klidně si hlídání nastavte znovu na mapě.', '');
    });
  } else if (unsubTok) {
    rpc('unsubscribe_watch', { p_token: unsubTok }).then(function (res) {
      if (res === true) show(CHECK, 'Odhlášeno', 'Už vám nebudeme posílat upozornění. Mrzí nás to — kdykoli se můžete přihlásit zpět.', 'ok');
      else show(X, 'Odkaz už neplatí', 'Vypadá to, že jste už odhlášeni nebo odkaz vypršel.', '');
    });
  } else {
    show(BELL, 'Hlídání lokality', 'Tuto stránku otevřete odkazem z e-mailu (potvrzení nebo odhlášení). Hlídání si nastavíte přímo na mapě.', '');
  }
})();
</script>
</body>
</html>
